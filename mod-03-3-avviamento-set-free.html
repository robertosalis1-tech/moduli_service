ssima (TCIT0147 par. 9.8)"}, {"k": "txt", "t": "Concentrazione massima consentita R410A secondo EN 378-1: 0,44 kg/m3 . Calcolo: C = R / V (R = carica totale del sistema in kg, V = volume del locale in m3). Prestare particolare attenzione a scantinati e locali dove il refrigerante, più pesante dell'aria, può ristagnare."}, {"k": "row", "f": [{"n": "LOC_c", "r": [210, 311, 270, 325], "p": 18, "t": "tx", "l": "Concentrazione calcolata C = R / V", "u": "kg/m3"}]}, {"k": "row", "f": [{"n": "LOC_c_es", "t": "calc", "l": "Esito concentrazione (R410A: limite 0,44 kg/m3)", "p": 18, "r": [210, 311, 270, 325]}]}, {"k": "txt", "t": "Verifica R410A N.A."}, {"k": "tri", "base": "LOC_1", "o": ["SI", "NO", "NA"], "names": ["LOC_1_SI", "LOC_1_NO", "LOC_1_NA"], "on": ["Yes", "Yes", "Yes"], "p": 18, "r": [479, 350, 490, 361], "l": "C è pari o inferiore a 0,44 kg/m3? (se SI le contromisure non sono necessarie: rispondere N.A. alle voci seguenti) IMPORTANTE"}, {"k": "tri", "base": "LOC_2", "o": ["SI", "NO", "NA"], "names": ["LOC_2_SI", "LOC_2_NO", "LOC_2_NA"], "on": ["Yes", "Yes", "Yes"], "p": 18, "r": [479, 377, 490, 388], "l": "Se C supera il limite: è presente un'apertura di ventilazione verso il locale adiacente (apertura nel muro senza porta, o sopra/sotto la porta) superiore allo 0,15% della superficie del pavimento?"}, {"k": "tri", "base": "LOC_3", "o": ["SI", "NO", "NA"], "names": ["LOC_3_SI", "LOC_3_NO", "LOC_3_NA"], "on": ["Yes", "Yes", "Yes"], "p": 18, "r": [479, 399, 490, 410], "l": "Se C supera il limite: è presente un'apertura senza persiane che consenta la circolazione di aria pulita nel locale?"}, {"k": "tri", "base": "LOC_4", "o": ["SI", "NO", "NA"], "names": ["LOC_4_SI", "LOC_4_NO", "LOC_4_NA"], "on": ["Yes", "Yes", "Yes"], "p": 18, "r": [479, 416, 490, 427], "l": "Se C supera il limite: è installata una ventola collegata a un sensore di gas refrigerante?"}, {"k": "tip", "t": "Se il limite è superato devono essere adottate tutte le contromisure sopra indicate."}, {"k": "txt", "t": "Impianti R32 (A2L) - superficie minima del locale (TCIT0150 / TCIT0153)"}, {"k": "txt", "t": "L'R32 è un refrigerante infiammabile con bassa velocità di combustione ( classe A2L , ISO 817). Procedura del manuale Hitachi: carica totale inferiore a 1,84 kg : nessun requisito di superficie minima. Carica pari o superiore a 1,84 kg : ricavare la superficie minima Amin dalla tabella del manuale di installazione/sicurezza in base alla carica (mc) e all'altezza di installazione (h0). Se il locale (stanza A) è più piccolo di Amin, verificare un locale adiacente (stanza B): la superficie A + B deve superare Amin totale ed è necessaria la ventilazione naturale tra le stanze con apertura minima Anv,min Se nessuna opzione è possibile, scegliere un'altra configurazione (ridurre la lunghezza delle tubazioni e quindi la carica, sistema monoblocco, ecc.) o contattare Hitachi."}, {"k": "row", "f": [{"n": "LOC_amin", "r": [210, 536, 260, 549], "p": 18, "t": "tx", "l": "Superficie minima Amin da tabella", "u": "m2"}, {"n": "LOC_areab", "r": [486, 536, 534, 549], "p": 18, "t": "tx", "l": "Superficie stanza B adiacente", "u": "m2"}]}, {"k": "row", "f": [{"n": "LOC_anv", "r": [210, 555, 260, 568], "p": 18, "t": "tx", "l": "Apertura minima Anv,min richiesta", "u": "dm2"}, {"n": "LOC_aa", "r": [487, 555, 530, 568], "p": 18, "t": "tx", "l": "Apertura bassa realizzata dm2 Apertura alta", "u": "dm2"}]}, {"k": "txt", "t": "Verifica R32 N.A."}, {"k": "tri", "base": "LOC_5", "o": ["SI", "NO", "NA"], "names": ["LOC_5_SI", "LOC_5_NO", "LOC_5_NA"], "on": ["Yes", "Yes", "Yes"], "p": 18, "r": [479, 589, 490, 600], "l": "La carica totale di R32 è inferiore a 1,84 kg? (se SI rispondere N.A. alle voci seguenti sulla superficie)"}, {"k": "tri", "base": "LOC_6", "o": ["SI", "NO", "NA"], "names": ["LOC_6_SI", "LOC_6_NO", "LOC_6_NA"], "on": ["Yes", "Yes", "Yes"], "p": 18, "r": [479, 606, 490, 617], "l": "Con carica pari o superiore a 1,84 kg: la superficie del locale è pari o superiore ad Amin? IMPORTANTE"}, {"k": "tri", "base": "LOC_7", "o": ["SI", "NO", "NA"], "names": ["LOC_7_SI", "LOC_7_NO", "LOC_7_NA"], "on": ["Yes", "Yes", "Yes"], "p": 18, "r": [479, 623, 490, 634], "l": "Locale sottodimensionato: la superficie della stanza A + stanza B supera Amin totale?"}, {"k": "txt", "t": "Almeno metà di Anv,min è realizzata con aperture basse, entro 200 mm dal pavimento, con base non oltre 100"}, {"k": "tri", "base": "LOC_8", "o": ["SI", "NO", "NA"], "names": ["LOC_8_SI", "LOC_8_NO", "LOC_8_NA"], "on": ["Yes", "Yes", "Yes"], "p": 18, "r": [479, 650, 490, 661], "l": "mm dal pavimento e non più alta del punto di possibile rilascio del refrigerante? (le aperture oltre 300 mm dal pavimento non contano per Anv,min)"}, {"k": "tri", "base": "LOC_9", "o": ["SI", "NO", "NA"], "names": ["LOC_9_SI", "LOC_9_NO", "LOC_9_NA"], "on": ["Yes", "Yes", "Yes"], "p": 18, "r": [479, 682, 490, 693], "l": "È presente una seconda apertura alta, pari ad almeno il 50% di Anv,min, posizionata ad almeno 1,5 m dal pavimento?"}, {"k": "tri", "base": "LOC_10", "o": ["SI", "NO", "NA"], "names": ["LOC_10_SI", "LOC_10_NO", "LOC_10_NA"], "on": ["Yes", "Yes", "Yes"], "p": 18, "r": [479, 709, 490, 720], "l": "Le aperture sono permanenti e non sigillabili, e le aperture tra le stanze hanno un'altezza di almeno 20 mm tra parete e pavimento?"}, {"k": "tri", "base": "LOC_11", "o": ["SI", "NO", "NA"], "names": ["LOC_11_SI", "LOC_11_NO", "LOC_11_NA"], "on": ["Yes", "Yes", "Yes"], "p": 18, "r": [479, 736, 490, 747], "l": "Nel locale non sono presenti fonti di innesco permanenti in funzione (fiamme libere, apparecchi a gas, stufe elettriche)?"}, {"k": "txt", "t": "Se i requisiti dei locali non sono rispettati e non sono adottate le misure previste dal manuale, il SAT non esegue il primo avviamento si applica la clausola di addebito per mancato avviamento."}]}, {"i": 19, "items": [{"k": "sec", "t": "MANCATO AVVIAMENTO PER CAUSE IMPUTABILI ALL'INSTALLATORE"}, {"k": "txt", "t": "Da compilare a cura del tecn  pagina, con nome e cognome leggibili. Inviala: inquadra il QR code con la fotocamera e allega la foto della ricevuta firmata, oppure scrivi a service-italia@bosch-hcgroup.com indicando il numero di avviamento. In alternativa consegnala al SAT o all'installatore."}], "title": "Cartolina garanzia", "cart": true}, {"i": 105, "title": "Condizioni di garanzia", "cart": true, "items": [{"k": "txt", "t": "Bosch Home Comfort Cooling and Heating SAS Via Marcantonio Colonna, 35 20149 Milano (MI), Italy C.F. e P.IVA; 07627830966 – REA. MI-1972164 www.hitachiaircon.com BOSCH and the symbol are registered trademarks of Robert Bosch GmbH, Germany. Hitachi Cooling & Heating products are manufactured and sold by Bosch Home Comfort Group.", "pdf": 1}, {"k": "sec", "t": "GARANZIA CONVENZIONALE HITACHI"}, {"k": "txt", "t": "Documento aggiornato al 1° gennaio 2026 Quando acquisti un prodotto Hitachi Cooling & Heating, hai a disposizione due tipi di garanzia:", "pdf": 1}, {"k": "txt", "t": "• una garanzia prevista dalla legge, che ti tutela nei confronti di chi ti ha venduto il prodotto (\"garanzia legale\"); • una garanzia aggiuntiva offerta volontariamente dal produttore Bosch Home Comfort Cooling and Heating S.A.S. – di seguito BHC – Italia (\"garanzia convenzionale\").", "pdf": 1}, {"k": "txt", "t": "La garanzia convenzionale si aggiunge alla garanzia legale e non la sostituisce né la riduce in alcun modo: puoi sempre far valere entrambe.", "pdf": 1}, {"k": "txt", "t": "Garanzia legale", "pdf": 1}, {"k": "txt", "t": "È Consumatore, ai sensi dell'art. 3, comma 1, lett. a) del Codice del Consumo, la persona fisica che agisce per scopi estranei all'attività imprenditoriale, commerciale, artigianale o professionale eventualmente svolta. Il Consumatore che acquista un prodotto beneficia, per legge, di una garanzia legale di conformità disciplinata dagli artt. 128 e ss. del Codice del Consumo – D.Lgs. 206/2005, come modificato dal D.Lgs. 170/2021. Di questa garanzia risponde per legge, nei confronti dell'acquirente, il venditore del prodotto (non il produttore). Il venditore è responsabile nei confronti del consumatore di qualsiasi difetto di conformità esistente al momento della consegna del bene e che si manifesta entro due anni da tale momento, ed è tenuto alla riparazione e sostituzione o, se queste risultano eccessivamente gravose, alla riduzione o restituzione del prezzo. Se l'acquisto è effettuato da un soggetto che agisce nell'esercizio della propria attività imprenditoriale o professionale (Professionista/Azienda), non si applica la garanzia legale di conformità del Codice del Consumo, riservata ai soli Consumatori, ma la garanzia per vizi prevista dagli artt. 1490 e ss. del Codice Civile, che prevede termini differenti (denuncia del vizio entro 8 giorni dalla scoperta e prescrizione dell'azione entro 1 anno dalla consegna).", "pdf": 1}, {"k": "txt", "t": "Garanzia convenzionale", "pdf": 1}, {"k": "txt", "t": "Fermi e impregiudicati i diritti riconosciuti dalla legge (garanzia legale), di seguito sono descritte le condizioni della garanzia convenzionale offerta volontariamente dal produttore, BHC – Italia, ai sensi dell'art. 135- quinquies del Codice del Consumo, che si aggiunge alla garanzia legale del venditore senza sostituirla né limitarla. La garanzia convenzionale BHC – Italia si applica a tutti i prodotti per la climatizzazione a marchio Hitachi Cooling & Heating venduti e installati nel territorio italiano. I prodotti Hitachi Cooling & Heating sono progettati e commercializzati da Bosch Home Comfort Group. Fermo restando e senza alcun pregiudizio dei diritti derivanti dalla garanzia legale, la società Bosch Home Comfort Cooling and Heating S.A.S. riconosce le seguenti condizioni di garanzia convenzionale:", "pdf": 1}, {"k": "txt", "t": "SERIE RESIDENZIALE MONO E MULTI (2 + 4 ANNI): I prodotti appartenenti alla Serie Residenziale sono coperti da una garanzia base della durata di 24 (ventiquattro) mesi, comprensiva di ricambi e manodopera, decorrente dalla data di acquisto, come attestata da idonea documentazione fiscale che deve essere inviata al SAT di zona al momento dell'apertura della richiesta di intervento in garanzia (Base). Con riferimento e limitatamente ai soli guasti relativi alle schede elettroniche e al compressore, è prevista inoltre un'estensione gratuita della garanzia di 48 mesi, che decorre al termine della Base (Estensione). La fornitura di questi ricambi e il relativo trasporto presso il SAT di zona saranno a titolo gratuito. Per l'intera durata del periodo di Estensione, gli interventi effettuati sulle unità non includono la manodopera da parte del SAT di zona, che rimane pertanto esclusa e a carico del cliente. Riepilogo:", "pdf": 1}, {"k": "txt", "t": "• Base: 24 mesi dalla data di acquisto, ricambi e manodopera compresi. • Documentazione richiesta: idonea documentazione fiscale, da inviare al SAT di zona all'apertura della richiesta di intervento. • Estensione: 48 mesi aggiuntivi, gratuita; decorre al termine della Base. • Copertura durante l'estensione: limitata a schede elettroniche e compressore (ricambi e trasporto al SAT gratuiti); manodopera esclusa e a carico del cliente.", "pdf": 1}, {"k": "txt", "t": "Elenco modelli unità esterne – Serie Residenziale Mono e Multi:", "pdf": 1}, {"k": "txt", "t": "• airHome 800: RAC-XJ-WHBE • airHome 600: RAC-VJ-WHAE • airHome 400: RAC-DJ-WHAE • airHome 200: RAC-CJ-WHAE • airHome Floor: RAC-XJ-FHAE • Light Commercial Canalizzabile: RAC-NPE (taglia 70: RAC-70NPD) • airHome Ducted Slim: RAC-VJ-NHAE • airHome Cassette 4-vie: RAC-VJ-NHAE • Multisplit (Gamma Multizone) – unità esterna comune: RAM-G-N-HCE", "pdf": 1}, {"k": "txt", "t": "Nota: la garanzia riconosciuta sull'unità esterna si intende estesa anche alla/e unità interna/e abbinata/e nello stesso sistema.", "pdf": 1}, {"k": "txt", "t": "SERIE COMMERCIALE UTOPIA & IVX (2 + 3 ANNI): È prevista una garanzia base della durata di 24 (ventiquattro) mesi, comprensiva di ricambi e manodopera, decorrente dalla data di acquisto, comprovata da idonea documentazione fiscale da inviare al SAT al momento dell'apertura della richiesta di intervento in garanzia (Base). Qualora l'avviamento dell'impianto venga effettuato da un SAT autorizzato, la garanzia, con riferimento e limitatamente ai componenti, è estesa gratuitamente per ulteriori 36 (trentasei) mesi decorrenti dal termine della Base (Estensione). Durante il periodo di Estensione, la copertura riguarda i componenti dell'unità, mentre è espressamente esclusa la manodopera del SAT, che resta pertanto a carico del cliente. Riepilogo:", "pdf": 1}, {"k": "txt", "t": "• Base: 24 mesi dalla data di acquisto, ricambi e manodopera compresi. • Documentazione richiesta: idonea documentazione fiscale, da inviare al SAT all'apertura della richiesta di intervento. • Estensione: 36 mesi aggiuntivi, gratuita, dal termine della Base. • Condizione per l'estensione: avviamento dell'impianto eseguito da un SAT autorizzato. • Copertura durante l'estensione: componenti dell'unità compresi; manodopera del SAT esclusa e a carico del cliente.", "pdf": 1}, {"k": "txt", "t": "Elenco modelli unità esterne – Serie Commerciale Utopia & IVX:", "pdf": 1}, {"k": "txt", "t": "• Utopia Prime: RAS-HNC2E / RAS-HRC2E / RAS-HVNC2E / RAS-HVRC2E / RAS-HVRC3 • IVX Prime: RAS-HNP2E / RAS-HRP2E / RAS-HVNP2E / RAS-HVRP2E • IVX Centrifugo: RASC-HNPE • IVX XH: RAS-XHNPE / RAS-XHNP1E / RAS-XHVNP1E", "pdf": 1}, {"k": "txt", "t": "Nota: la garanzia riconosciuta sull'unità esterna si intende estesa anche alla/e unità interna/e abbinata/e nello stesso sistema.", "pdf": 1}, {"k": "txt", "t": "SERIE VRF SET FREE (2 + 2 ANNI): È prevista una garanzia base della durata di 24 (ventiquattro) mesi, comprensiva di ricambi e manodopera, decorrente dalla data di acquisto, come comprovata da idonea documentazione fiscale da inviare al SAT di zona al momento dell'apertura della richiesta di intervento in garanzia (Base). Qualora l'avviamento dell'impianto venga effettuato da un SAT autorizzato, la garanzia è estesa gratuitamente per ulteriori 24 (ventiquattro) mesi decorrenti dal termine della Base (Estensione). Per l'intera durata del periodo di Estensione della garanzia, la copertura comprende tutti i componenti dell'unità, inclusi ricambi e manodopera. La fornitura dei ricambi e il relativo trasporto presso il SAT di zona sono a titolo gratuito, così come la manodopera per l'installazione dei ricambi da parte del SAT di zona autorizzato. Riepilogo:", "pdf": 1}, {"k": "txt", "t": "• Base: 24 mesi dalla data di acquisto, ricambi e manodopera compresi. • Documentazione richiesta: idonea documentazione fiscale, da inviare al SAT di zona all'apertura della richiesta di intervento. • Estensione: 24 mesi aggiuntivi, gratuita. • Condizione per l'estensione: avviamento dell'unità eseguito esclusivamente da un SAT di zona autorizzato (condizione necessaria e imprescindibile). • Copertura durante l'estensione: tutti i componenti dell'unità, ricambi e manodopera compresi, inclusa fornitura, trasporto e installazione dei ricambi, a titolo gratuito.", "pdf": 1}, {"k": "txt", "t": "Elenco modelli unità esterne – Serie VRF Set Free:", "pdf": 1}, {"k": "txt", "t": "• SET FREE MINI S & L: RAS-FSNME / RAS-FSVNME / RAS-FSXNME • air365 Max: RAS-FSXNS2E • air365 Max Pro: RAS-FSXNP2E", "pdf": 1}, {"k": "txt", "t": "Nota: la garanzia riconosciuta sull'unità esterna si intende estesa anche alla/e unità interna/e abbinata/e nello stesso sistema.", "pdf": 1}, {"k": "txt", "t": "SERIE HEATING SOLUTION airH2O (2 + 3 ANNI): È prevista una garanzia base della durata di 24 (ventiquattro) mesi, comprensiva di ricambi e manodopera, decorrente dalla data di acquisto del prodotto, come comprovata da idonea documentazione fiscale da inviare al SAT di zona al momento dell'apertura della richiesta di intervento in garanzia. L'avviamento dell'impianto è in ogni caso obbligatorio e deve essere eseguito esclusivamente da un SAT di zona autorizzato; al ricorr  Italia entro 3 mesi dalla data di avviamento, per l'intera durata dell'estensione. • Prodotto IN WALL: stesse condizioni della serie Heating Solution, con esclusione della componentistica accessoria del circuito idraulico, coperta per soli 24 mesi dalla data di acquisto. • Prodotto airH2O 800: condizioni applicabili solo se, oltre al primo avviamento, è stata acquistata la visita pre-installativa, entrambe eseguite da un SAT di zona autorizzato; il mancato rispetto della normativa sui refrigeranti del gruppo A3 impedisce il primo avviamento e comporta la decadenza dell'estensione.", "pdf": 1}, {"k": "txt", "t": "Elenco modelli unità esterne – Serie Heating Solution airH2O:", "pdf": 1}, {"k": "txt", "t": "• Yutaki M: RASM-VR2E (2-3HP) / RASM-R1E - RASM-VR1E (4-7HP) • airH2O 600 S: RAS-WHRP2E / RAS-WHVRP2E / RAS-WHNPE • airH2O 600 S Combi: RAS-WHRP2E / RAS-WHVRP2E • airH2O 600 S Combi – Nordic Version: RAS-WHVRP2E • airH2O 800 M: RASM-VTW2E • airH2O 800 H: RASM-VTW2E • airH2O 800 H Combi: RASM-VTW2E • Prodotto IN WALL: stessa unità esterna della serie airH2O 600 S di riferimento", "pdf": 1}, {"k": "txt", "t": "Nota: la garanzia riconosciuta sull'unità esterna si intende estesa anche alla/e unità interna/e (modulo idronico) abbinata/e nello stesso sistema. SERIE Yutampo e airHome Triple C (2 + 4 ANNI): È prevista una garanzia base della durata di 24 (ventiquattro) mesi, comprensiva di ricambi e manodopera, decorrente dalla data di acquisto, come attestata da fattura o altro idoneo documento fiscale da inviare al SAT di zona al momento dell'apertura della richiesta di intervento in garanzia. Con riferimento e limitatamente alle schede elettroniche e al compressore, con esclusione della manodopera e del serbatoio per l'acqua calda sanitaria, i cui costi restano pertanto a carico del cliente, la garanzia è estesa gratuitamente per ulteriori 48 (quarantotto) mesi decorrenti dal termine della Base (Estensione). Qualora l'accessorio ATW-CP-05 (anodo elettronico) venga acquistato e installato contestualmente e sia attivata l'opzione di primo avviamento (eseguito esclusivamente da un SAT di zona autorizzato), anche il serbatoio per l'acqua calda sanitaria rientra nella copertura dell'estensione di garanzia (restando esclusa la manodopera), alle medesime condizioni, termini e limitazioni sopra specificati. Riepilogo:", "pdf": 1}, {"k": "txt", "t": "• Base: 24 mesi dalla data di acquisto, ricambi e manodopera compresi. • Documentazione richiesta: fattura o altro idoneo documento fiscale, da inviare al SAT di zona all'apertura della richiesta di intervento. • Estensione: 48 mesi aggiuntivi, automatica e gratuita. • Copertura durante l'estensione: limitata a schede elettroniche e compressore; esclusi manodopera e serbatoio acqua calda sanitaria, a carico del cliente. • Estensione al serbatoio: se acquistato e installato contestualmente l'accessorio ATW-CP-05 (anodo elettronico) e attivato il primo avviamento da un SAT di zona autorizzato, il serbatoio rientra nella copertura (manodopera comunque esclusa), alle stesse condizioni e limiti.", "pdf": 1}, {"k": "txt", "t": "Elenco modelli unità esterne – Serie Yutampo e airHome Triple C:", "pdf": 1}, {"k": "txt", "t": "• Yutampo R32: RAW-RHC (bollitore collegato: TAW-RHC) • airHome Triple C: RAM-Y-N-HAE", "pdf": 1}, {"k": "txt", "t": "Nota: la garanzia riconosciuta sull'unità esterna si intende estesa anche alla/e unità interna/e (o al bollitore) abbinata/e nello stesso sistema.", "pdf": 1}, {"k": "txt", "t": "SERIE COMMERCIALE PRIMAIRY (2 ANNI): È prevista una garanzia base della durata di 24 (ventiquattro) mesi, decorrente dalla data di acquisto del prodotto, come comprovata da fattura o altro idoneo documento fiscale da inviare al SAT di zona al momento dell'apertura della richiesta di intervento in garanzia. Riepilogo:", "pdf": 1}, {"k": "txt", "t": "• Base: 24 mesi dalla data di acquisto del prodotto. • Documentazione richiesta: fattura o altro idoneo documento fiscale, da inviare al SAT di zona all'apertura della richiesta di intervento. • Estensione: non prevista.", "pdf": 1}, {"k": "txt", "t": "Elenco modelli unità esterne – Serie Commerciale Primairy:", "pdf": 1}, {"k": "txt", "t": "• Primairy (Canalizzata / Cassette 4-vie / Soffitto-Pavimento) – unità esterna comune: RAS-UFESNH1 (versione monofase) / RAS-UFESMH1 (versione trifase)", "pdf": 1}, {"k": "txt", "t": "Nota: la garanzia riconosciuta sull'unità esterna si intende estesa anche alla/e unità interna/e abbinata/e nello stesso sistema. SERIE SAMURAI (2 ANNI): È prevista una garanzia base della durata di 24 (ventiquattro) mesi, comprensiva di ricambi e manodopera, decorrente dalla data di acquisto, come comprovata da idonea documentazione fiscale da inviare al SAT di zona al momento dell'apertura della richiesta di intervento in garanzia. L'avviamento dell'unità costituisce condizione necessaria e imprescindibile per il riconoscimento della garanzia e deve essere eseguito esclusivamente da un SAT di zona autorizzato. Riepilogo:", "pdf": 1}, {"k": "txt", "t": "• Base: 24 mesi dalla data di acquisto, ricambi e manodopera compresi. • Documentazione richiesta: idonea documentazione fiscale, da inviare al SAT di zona all'apertura della richiesta di intervento. • Condizione necessaria: avviamento dell'unità eseguito esclusivamente da un SAT di zona autorizzato, condizione imprescindibile per il riconoscimento della garanzia. • Estensione: non prevista.", "pdf": 1}, {"k": "txt", "t": "Elenco modelli unità esterne – Serie Samurai:", "pdf": 1}, {"k": "txt", "t": "• Samurai S: RHMA-AVN • Samurai M: RHMA-AX • Samurai L: RCME-WH1", "pdf": 1}, {"k": "txt", "t": "Nota: le unità Samurai sono chiller monoblocco; non è prevista un'unità interna abbinata ai fini della presente garanzia.", "pdf": 1}, {"k": "sec", "t": "CONDIZIONI GENERALI DI GARANZIA"}, {"k": "txt", "t": "• Lo scontrino, la fattura, la ricevuta fiscale o la bolla di consegna con indicazione del modello acquistato sono gli unici documenti validi per riconoscere la garanzia di un prodotto e devono essere inviati al SAT di zona autorizzato per la verifica dei prodotti e per determinare la durata del periodo di garanzia. • La garanzia convenzionale di Bosch Home Comfort Cooling and Heating S.A.S. è valida solo per prodotti installati sul territorio italiano. • La concessione della garanzia convenzionale si applica solo coinvolgendo una figura appartenente alla rete di SAT autorizzati, incaricata di identificare l'anomalia e provvedere al ripristino della funzionalità. • Ogni intervento non imputabile a difettosità del prodotto e derivante da errori d'installazione, mancato rispetto di quanto indicato nei cataloghi e nei manuali tecnici, carente o errata manutenzione, manomissione o modifica del prodotto, non rientra negli interventi coperti da garanzia. • Decaduto il periodo di garanzia, ogni intervento sarà a carico del Cliente.", "pdf": 1}, {"k": "sec", "t": "CONDIZIONI DI SICUREZZA E ACCESSIBILITÀ"}, {"k": "txt", "t": "• In conformità alle norme e alle leggi vigenti in materia di sicurezza, le apparecchiature installate devono essere agevolmente e integralmente accessibili e raggiungibili in condizioni di sicurezza da parte del SAT di zona autorizzato e incaricato a svolgere qualsiasi operazione di diagnosi o riparazione. • Eventuali criticità specifiche del sito di installazione devono essere preventivamente comunicate al momento della richiesta di intervento. In ogni caso, il Cliente è tenuto a ripristinare e garantire le condizioni di sicurezza del sito necessarie allo svolgimento dell'intervento. • Le spese derivanti da tali attività di adeguamento o ripristino non sono in alcun caso a carico del Service BHC – Italia o del SAT di zona incaricato. • Il SAT di zona può, qualora ritenga per qualsiasi comprovata ragione che il luogo o le condizioni di lavoro non siano sicure, rifiutare l'intervento, segnalando le criticità riscontrate a BHC – Italia per le opportune valutazioni. Qualora, a seguito di verifica in loco, non sussistano le condizioni di sicurezza necessarie per l'esecuzione dell'intervento, come opportunamente documentato dal SAT autorizzato, l'intervento verrà annullato e il costo della chiamata sarà addebitato al Cliente.", "pdf": 1}, {"k": "sec", "t": "AMBITO DELLA GARANZIA"}, {"k": "txt", "t": "Fermo restando quanto sopra, BHC – Italia riparerà o sostituirà, a propria discrezione, i prodotti che presentino anomalie riconducibili a difetti di materiale e/o di fabbricazione, a condizione che siano rispettati i requisiti di seguito elencati:", "pdf": 1}, {"k": "txt", "t": "• Il prodotto deve essere installato in conformità alle istruzioni riportate nei cataloghi tecnici e nei manuali di installazione, esclusivamente da installatori in possesso di tutte le certificazioni previste dalla normativa vigente. • Il prodotto deve essere mantenuto in buono stato di conservazione, con uso corretto e manutenzione diligente. • Il Cliente non deve aver effettuato interventi diretti sul prodotto né tramite terzi non autorizzati da BHC – Italia, inclusi tentativi di riparazione o sostituzione di componenti. • Gli interventi eseguiti dal SAT di zona autorizzato durante il periodo di garanzia non comportano proroga, rinnovo o estensione della garanzia originale. • I ricambi forniti in vendita al di fuori del periodo di garanzia, se installati da personale autorizzato BHC – Italia, sono coperti da un'autonoma garanzia della durata di 12 (dodici) mesi decorrenti dalla data di installazione.", "pdf": 1}, {"k": "txt", "t": "• I sistemi appartenenti alle serie VRF, Heating Solution e Samurai devono essere obbligatoriamente avviati dal SAT di zona autorizzato. L'eventuale carica aggiuntiva di refrigerante, qualora necessaria, è a carico del Cliente (in persona del soggetto incaricato dell'installazione). Il SAT di zona autorizzato deve essere messo in condizione di verificare la corretta esecuzione del vuoto; in caso di impossibilità a eseguire tale verifica, la garanzia decadrà. • L'avviamento eseguito dal SAT di zona autorizzato non costituisce in alcun modo collaudo, approvazione o validazione dell'intera installazione, che rimane sotto la piena responsabilità dell'installatore incaricato dal Cliente.", "pdf": 1}, {"k": "sec", "t": "ESCLUSIONE DALLA GARANZIA"}, {"k": "txt", "t": "La presente garanzia non copre, a titolo esemplificativo e non esaustivo, i seguenti casi:", "pdf": 1}, {"k": "txt", "t": "• Qualsiasi manipolazione impropria o non autorizzata dei parametri di configurazione del sistema. • Danni a persone o cose derivanti da installazione non conforme alla normativa vigente, da impianti non realizzati a regola d'arte e/o da manovre errate sui prodotti. • Qualsiasi danno diretto o indiretto causato da installazioni eseguite su impianti non a norma e/o privi della prescritta Dichiarazione di Conformità dell'impianto, rilasciata ai sensi della normativa applicabile. In tali casi, la garanzia si intende automaticamente decaduta e resta esclusa ogni responsabilità del Fornitore. • Danni o difetti causati da stoccaggio e/o trasporto non idonei.", "pdf": 1}, {"k": "sec", "t": "RICHIESTE DI ASSISTENZA"}, {"k": "txt", "t": "Per attivare la garanzia o richiedere un intervento di assistenza tecnica, è possibile utilizzare i seguenti canali:", "pdf": 1}, {"k": "txt", "t": "• Contact Center BHC – Italia al numero 02 94751456 dal lunedì al venerdì dalle 9,00 alle 18,00 • Sito internet: sezione \"Contattaci\" del sito https://www.hitachiaircon.com/it/contattaci • Rete SAT di zona: individuabile tramite il localizzatore presente sul sito all’indirizzo https://www.hitachiaircon.com/it/centri-di-assistenza o tramite il Contact Center. • Indirizzo e-mail dedicato: service-italia@bosch-hcgroup.com", "pdf": 1}, {"k": "txt", "t": "Documenti da allegare alla richiesta: lo scontrino, la fattura, la ricevuta fiscale o la bolla di consegna con indicazione del modello acquistato.", "pdf": 1}]}, {"i": 110, "items": [{"k": "txt", "t": "Ricevuta di conse function initSig(){document.querySelectorAll("canvas.sig").forEach(cv=>{const k=cv.dataset.sig,ctx=cv.getContext("2d"),R=2;cv.width=cv.clientWidth*R;cv.height=cv.clientHeight*R;
  const pen=()=>{ctx.lineWidth=2.6*R;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0b2a6b"};pen();
  if(sig[k]){const im=new Image();im.onload=()=>{ctx.drawImage(im,0,0,cv.width,cv.height);pen()};im.src=sig[k]}
  let dr=false,last=null;const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*R,(e.clientY-r.top)*R]};
  cv.onpointerdown=e=>{e.preventDefault();dr=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}last=pt(e);ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7);ctx.fillStyle="#0b2a6b";ctx.fill()};
  cv.onpointermove=e=>{if(!dr)return;e.preventDefault();const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p};
  const end=()=>{if(!dr)return;dr=false;sig[k]=cv.toDataURL("image/png");save()};cv.onpointerup=end;cv.onpointercancel=end;cv.onpointerleave=end})}
function clearSig(k){delete sig[k];save();const cv=document.querySelector(`canvas[data-sig="${k}"]`);if(cv)cv.getContext("2d").clearRect(0,0,cv.width,cv.height)}
let rsz;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(initSig,250)});
// ---------- salvataggio, import / export
let tm;function save(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({S,sig}));PR.push(S,KEYP)}catch(e){}},300)}
function load(){try{const t=JSON.parse(localStorage.getItem(KEY)||"null");if(t){S=t.S||{};sig=t.sig||{}}}catch(e){}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
const base=()=>SPEC.code.replace(/\W+/g,"_")+"_"+String(S[Object.keys(S).find(k=>/cliente|ute_nome|cli_nome/.test(k))]||"modulo").replace(/[^\w-]+/g,"_");
function saveJSON(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({modulo:SPEC.code,S,sig})],{type:"application/json"}));a.download=base()+".json";a.click()}
function importFile(inp){const f=inp.files[0];if(!f)return;inp.value="";
  if(/\.pdf$/i.test(f.name)||f.type==="application/pdf")return importPDF(f);
  const r=new FileReader();r.onload=()=>{try{const t=JSON.parse(r.result);S=t.S||{};sig=t.sig||{};save();renderAll();toast("Dati importati")}catch(e){alert("File non valido")}};r.readAsText(f)}
// legge un PDF compilato (es. check list ricevuta dall'installatore) e ne copia i valori nel modulo
function loadPdfLib(){return window.PDFLib?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement("script");s.src="lib/pdf-lib.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function importPDF(file){try{await loadPdfLib();const pdf=await PDFLib.PDFDocument.load(await file.arrayBuffer(),{ignoreEncryption:true});const form=pdf.getForm();let n=0;
  form.getFields().forEach(fl=>{const name=fl.getName(),L=PDFLib;let v;
    try{if(fl instanceof L.PDFTextField)v=fl.getText()||"";else if(fl instanceof L.PDFDropdown||fl instanceof L.PDFOptionList)v=(fl.getSelected()||[])[0]||"";else if(fl instanceof L.PDFCheckBox)v=fl.isChecked()?(CHK[name]||"Yes"):"Off";else if(fl instanceof L.PDFRadioGroup)v=fl.getSelected()||"";else return}catch(e){return}
    if(!(name in FD)&&!(name in CHK))return;if(CALCF.has(name))return;if(DATES.has(name))v=it2iso(v);if(v&&FD[name]&&FD[name].t!=="chk"&&FD[name].t!=="sig")v=v.toUpperCase();
    if(FD[name]&&FD[name].t==="sig")return;if(v!==""&&v!=="Off"||S[name]){S[name]=v;n++}});
  save();renderAll();toast(n+" campi importati dal PDF: controllare e completare in cantiere")}catch(e){console.error(e);alert("Impossibile leggere il PDF: "+e.message)}}
// ---------- PDF
const TPLKEY="033";
function doPDF(only){if(EXT.pdf){if(only!=="cart"&&window.FOTO&&FOTO.check&&!FOTO.check())return Promise.resolve();const FO=window.FOTO;if(only==="cart")window.FOTO=null;return EXT.pdf(only).finally(()=>{window.FOTO=FO})}if(TPLKEY&&window.PDFFILL){runCalc();const cc=only==="cart";return PDFFILL.share({key:TPLKEY,values:Object.assign({},C,S),sig:sig,mode:cc?"cart":"full",title:SPEC.title,code:SPEC.code,cliente:S.cliente||S.v_cliente||S.ragione_sociale||"",name:base()+(cc?"_cartolina":"")})}runCalc();let h=`<h1>${esc(only==="cart"?"Cartolina garanzia":SPEC.title)}</h1>`;
  const fv=f=>{if(f.t==="chk")return S[f.n]&&S[f.n]!=="Off"?"SI":"";if(f.t==="sig")return"";const v=String(val(f.n)??"");return DATES.has(f.n)?iso2it(v):v};
  SPEC.pages.forEach(pg=>{if(pageCover(pg.i))return;if(only==="cart"&&!pg.cart)return;let sec="",rows=[],pend=[],skipS=false;
    const out=()=>{if(!rows.length&&!pend.length)return;h+=`<h2>${esc(sec||SPEC.title)}</h2>`;if(rows.length){let t="<table>";for(let i=0;i<rows.length;i+=2)t+=`<tr><td>${esc(rows[i][0])}</td><td>${esc(rows[i][1])}</td><td>${esc(rows[i+1]?rows[i+1][0]:"")}</td><td>${esc(rows[i+1]?rows[i+1][1]:"")}</td></tr>`;h+=t+"</table>"}h+=pend.join("");rows=[];pend=[]};
    pg.items.forEach(it=>{if(EXT.items&&EXT.items[it.k]){const x=EXT.items[it.k].pdf?EXT.items[it.k].pdf(it):"";if(x){out();pend.push(x)}return}if(it.k==="txt"&&it.pdf){pend.push(`<p>${esc(it.t)}</p>`);return}if(it.k==="sec"){out();sec=it.t;skipS=it.cp!=null&&!!pageCover(it.cp);return}if(skipS)return;
      if(it.k==="row")it.f.forEach(f=>{if(hid(f))return;if(f.t==="sig"){if(sig[f.n])pend.push(`<table><tr><th>${esc(f.l||"Firma")}</th></tr><tr><td><img src="${sig[f.n]}"></td></tr></table>`);return}const v=fv(f);if(v)rows.push([(f.l||f.n)+(f.u?" ("+f.u+")":""),v])});
      if(it.k==="sigb"){if(hid(it.sig))return;const nm=it.nome?val(it.nome.n):"",dt=it.data?iso2it(String(val(it.data.n)||"")):"";if(!nm&&!sig[it.sig.n])return;out();if(!sec)sec="Firme";pend.push(`<table><tr><th>Firma - ${esc(it.title)}${nm?": "+esc(nm):""}${dt?" - "+esc(dt):""}</th></tr><tr><td>${sig[it.sig.n]?`<img src="${sig[it.sig.n]}">`:""}</td></tr></table>`);out();return}
      if(it.k==="uil"){if(it.cp!=null&&pageCover(it.cp))return;const N=Math.max(1,Math.min(64,parseInt(val(it.cnt))||parseInt(val(it.alt))||1)),b=i=>`s${it.s}_ui${i}_`,R2=[];for(let i=1;i<=N;i++)if(["mod","sn","ind","loc"].some(x=>S[b(i)+x]))R2.push([i].concat(["mod","sn","ind","loc"].map(x=>S[b(i)+x]||"")));if(R2.length){out();pend.push(`<table><tr><th>U.I.</th><th>Modello</th><th>Matricola</th><th>N. indirizzo</th><th>Locale / zona</th></tr>${R2.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`)}return}
      if(it.k==="tri"){const i=it.names.findIndex(n=>S[n]&&S[n]!=="Off");if(i>=0)rows.push([it.l,it.o[i]==="NV"||it.o[i]==="NA"?"N.A.":it.o[i]])}
      if(it.k==="tab"){const R=it.rows.filter(r=>r.f.some(f=>f&&!hid(f)&&fv(f)));if(R.length){out();pend.push(`<table><tr><th></th>${it.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${R.map(r=>`<tr><td>${esc(r.l)}</td>${r.f.map(f=>`<td>${esc(!f||hid(f)?"":fv(f))}</td>`).join("")}</tr>`).join("")}</table>`)}}});
    out()});
  let box=$("#pdfsrc");if(!box){box=document.createElement("div");box.id="pdfsrc";box.style.display="none";document.body.appendChild(box)}box.innerHTML=h;
  const FO=window.FOTO;if(only==="cart")window.FOTO=null;try{PDFK.share(box,{title:only==="cart"?"Cartolina garanzia":SPEC.title,code:only==="cart"&&SPEC.cartCode?SPEC.cartCode:SPEC.code,name:base()+(only==="cart"?"_cartolina":"")})}finally{window.FOTO=FO}}
load();PR.pull(S,KEYP);renderAll();
// ---------- check list: invio al tecnico e caricamento dalla pagina iniziale
let CLBYTES=null;
function nextSteps(){const c=window.TRASF&&TRASF.CL[KEYP];if(!c)return;const b=$("#nextbox");b.style.display="block";
  b.innerHTML=`<b>✓ Check list caricata.</b> I dati comuni (cliente, indirizzo, installatore, modelli e matricole) sono nella pratica corrente. Controllare i dati qui sotto, poi:<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${c.verb?`<a class="btn pri" href="${c.verb}" style="text-decoration:none">Apri ${esc(c.vt.split(" - ")[0])} precompilato</a>`:""}<button class="btn" onclick="toTech()">✉ Invia al tecnico</button></div>`}
async function toTech(){save();await new Promise(r=>setTimeout(r,350));let b=CLBYTES;if(!b&&window.PDFFILL){try{runCalc();b=await PDFFILL.make({key:TPLKEY,values:Object.assign({},C,S),sig:sig,mode:"full",title:SPEC.title,code:SPEC.code,cliente:S.cliente||""})}catch(e){b=null}}TRASF.sendTech(KEYP,b)}
if(window.TRASF&&TRASF.CL[KEYP])$("#btnTech").style.display="";
if(/[?&]import=1/.test(location.search)){try{const r=JSON.parse(sessionStorage.getItem("cl_import")||"null");sessionStorage.removeItem("cl_import");history.replaceState(null,"",location.pathname);
  if(r&&r.k===KEYP){const u=Uint8Array.from(atob(r.b),c=>c.charCodeAt(0));CLBYTES=u;S={};sig={};importPDF(new File([u],r.n||"checklist.pdf",{type:"application/pdf"})).then(nextSteps)}}catch(e){console.error(e)}}
if(/[?&]ricevuta=1/.test(location.search)){history.replaceState(null,"",location.pathname);nextSteps()}
</script>
