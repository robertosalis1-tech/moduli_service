<!doctype html>
<html lang="it">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">

<title>Pre-avviamento CSNET</title>
<style>

:root{--red:#e60027;--navy:#1f2b45;--blue:#3d7ab8;--txt:#1f2b45;--mut:#667085;--line:#d5dce7;--bg:#f3f5f8;--fld:#fff8c4;--ok:#16794a;--okbg:#ddf3e6;--warn:#a86400;--warnbg:#fff1d6;--ko:#c00;--kobg:#ffe1e1;--na:#eceef1}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px #0002}
.band{background:var(--red);color:#fff;font-size:12px;padding:4px 16px}
.hd{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.hd img{height:24px}
.hd h1{font-size:17px;margin:0;flex:1;min-width:200px}
.hd h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer;color:var(--navy)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
nav{max-width:1100px;margin:auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav button{border:0;background:none;padding:9px 11px;font:inherit;font-size:14px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--navy);border-color:var(--red)}
nav button i{font-style:normal;display:inline-block;min-width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle;background:#ccd}
nav button i.ok{background:var(--ok)}nav button i.warn{background:#e0a020}nav button i.ko{background:var(--ko)}
main{max-width:1100px;margin:auto;padding:14px 16px 80px}
.pane{display:none}.pane.on{display:block}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px #0001;margin:0 0 14px;overflow:hidden}
.card>h2{margin:0;padding:9px 14px;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;background:var(--blue);color:#fff}
.card.na{opacity:.55}.card.na>h2{background:#8a98aa}
.card .na-msg{padding:16px;color:var(--mut);font-style:italic;background:var(--na)}
.body{padding:12px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
label{display:block;font-size:12px;font-weight:600;color:var(--navy)}
label u{text-decoration:none;color:var(--mut);font-weight:400}
input,select,textarea{width:100%;margin-top:3px;padding:8px 9px;border:1px solid #c9d2df;border-radius:8px;font:inherit;background:var(--fld)}
.calc{background:var(--okbg)!important;border-color:#bfe3cc!important;font-weight:600;color:var(--txt)}
.calc.warn{background:var(--warnbg)!important;color:var(--warn)}.calc.ko{background:var(--kobg)!important;color:var(--ko)}.calc.ok{color:var(--ok)}
input.warn{background:#ffd99a!important;border-color:#e0a020}
input.ko,select.ko{color:var(--ko);border:2px solid var(--ko)!important;background:var(--kobg)!important;font-weight:700}input.warn,select.warn{border:2px solid #e0a020!important;background:var(--warnbg)!important}input.ok{color:var(--ok)}
textarea{min-height:80px}
input.off{background:#d9dbe0!important;border-color:#d9dbe0}
.fcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.fcs button{border:3px solid transparent;border-radius:10px;padding:2px;background:#fff;cursor:pointer}
.fcs button.on{border-color:#1a73d9;box-shadow:0 0 0 3px #1a73d933}
.fcs img{width:100%;display:block}
.mors{position:relative;margin-top:10px}
.mors img{width:100%;display:block}
.mors i{position:absolute;top:-2px;bottom:-2px;border:2.5px solid;border-radius:4px}
.mors i.in{border-color:#1a73d9;background:#1a73d914}.mors i.sn{border-color:#8a2be2;background:#8a2be214}.mors i.out{border-color:#f27300;background:#f2730014}
.leg{margin-top:8px;font-size:13px}.leg span{display:inline-block;border-radius:12px;padding:3px 9px;margin:2px;font-weight:600}.leg .in{background:#e3efff;color:#0b4fa0}.leg .out{background:#ffeedd;color:#a24c00}.leg .sn{background:#f1e6fd;color:#5b1a9e}
.tip{background:#fbe1e1;color:#8a0a0a;font-size:12.5px;font-style:italic;padding:7px 10px;border-radius:8px;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer;background:#fff}
.chip input{width:18px;height:18px;margin:0;accent-color:var(--red)}
.dips{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 24px}
.dip{display:flex;align-items:center;gap:10px}
.dip b{width:120px;font-size:13px;font-weight:600}
.dip .sw{display:flex;gap:4px}
.dip .sw span{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mut)}
.dip .sw button{width:24px;height:30px;border:1.5px solid #1f4f78;border-radius:4px;background:#0ff;cursor:pointer;padding:0;position:relative}
.dip .sw button.on{background:#1f2b45}
.dip .sw button::after{content:"";position:absolute;left:4px;right:4px;height:9px;background:#fff;border-radius:2px;bottom:3px}
.dip .sw button.on::after{top:3px;bottom:auto}
.dip.na{opacity:.35;pointer-events:none}
table{border-collapse:collapse;width:100%}
th{background:var(--blue);color:#fff;font-size:12px;text-align:left;padding:6px 7px}
td{border-bottom:1px solid var(--line);padding:3px 5px;font-size:13px}
td input{margin:0;padding:5px 6px}
td.code{font-weight:700;color:#1f4f78;white-space:nowrap}
tr.sub td{background:#e3ebf6;font-style:italic;font-weight:600;color:#1f4f78}
td.na input{background:var(--na);border-color:var(--na)}
.scroll{overflow-x:auto}
.ck{display:grid;grid-template-columns:30px 1fr repeat(3,48px);align-items:center;border-bottom:1px solid var(--line);padding:5px 0;gap:4px}
.ck .n{font-weight:700;color:var(--blue);text-align:center}.ck .t{font-size:13.5px}.ck .imp{color:var(--red);font-weight:700;font-size:11px}
.ck input{width:20px;height:20px;justify-self:center;accent-color:var(--red)}
.ck.na{opacity:.4;pointer-events:none}
.ckh{font-size:12px;font-weight:700;color:var(--mut);border-bottom:2px solid var(--line)}.ckh span{text-align:center}
.esito{padding:12px 14px;border-radius:10px;font-weight:700;font-size:16px}
.esito.ok{background:var(--okbg);color:var(--ok)}.esito.warn{background:var(--warnbg);color:var(--warn)}.esito.ko{background:var(--kobg);color:var(--ko)}.esito.none{background:var(--na);color:var(--mut)}
.esito ul{margin:6px 0 0;padding-left:18px;font-weight:500;font-size:14px}
.pill{display:inline-block;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;background:var(--na);color:var(--mut)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.ko{background:var(--kobg);color:var(--ko)}
.sig{border:1px dashed #9aa6b8;border-radius:10px;background:#fff;touch-action:none;width:100%;height:140px;display:block}
.navb{display:flex;justify-content:space-between;margin-top:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;z-index:50}
.toast.on{opacity:1}
#print{display:none}
@media print{
  header,main,.toast{display:none!important}
  #print{display:block;font:9.5pt/1.3 Helvetica,Arial,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .pband{background:#e60027;color:#fff;font-size:8pt;padding:3pt 6pt;margin:4pt 0}
  #print h1{font-size:15pt;margin:2pt 0}
  #print h2{font-size:10pt;background:#3d7ab8;color:#fff;padding:3pt 6pt;margin:9pt 0 3pt;text-transform:uppercase}
  #print table{width:100%;border-collapse:collapse;margin:2pt 0 5pt}
  #print th{background:#e3ebf6;color:#1f2b45;border:1px solid #aab;font-size:7.5pt;padding:2pt 3pt;text-align:left}
  #print td{border:1px solid #ccd;font-size:8pt;padding:2pt 4pt}
  #print .pb{page-break-before:always}
  #print .es{padding:5pt;font-weight:700;border:1px solid #999}
  @page{size:A4;margin:11mm}
}

header{position:static!important;box-shadow:none!important}
.navw{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 4px #0002}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.band{padding-top:calc(4px + env(safe-area-inset-top))}
input:not([type=email]):not([type=date]):not([type=time]),textarea{text-transform:uppercase}
.txt{font-size:13px;color:#3a4558;margin:8px 0}
.tri{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0}
.tri .q{font-size:13.5px}.seg2{display:flex;gap:4px}
.seg2 button{min-width:46px;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font:inherit;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer}
.seg2 button.on{background:var(--navy);border-color:var(--navy);color:#fff}.seg2 button.on.no{background:var(--ko);border-color:var(--ko)}
.ftab td{padding:3px 4px}.ftab td.rl{font-size:12.5px;font-weight:600;color:var(--navy);white-space:nowrap;max-width:200px;white-space:normal}
.ftab input,.ftab select{min-width:70px;padding:5px 6px;margin:0}
.ftab .calc{font-size:12.5px}
.covmsg{background:#eceef1;border-radius:12px;padding:30px 16px;text-align:center;color:var(--mut);font-weight:600;white-space:pre-line}
.chkf{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500}.chkf input{width:20px;height:20px;margin:0;accent-color:var(--red)}
.sigs .sig{height:170px}
nav button.dim{opacity:.45}
.sigbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fbfcfe}.sigt{font-weight:700;color:var(--navy);margin-bottom:6px}
.imp{background:#eef5ff;border:1px solid #b9d3f3;border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:13.5px}
</style>

  $("#main").innerHTML=(tab===0&&IMPORT_HINT?`<div class="imp">${IMPORT_HINT}</div>`:"")+pageH(SPEC.pages[tab])+`<div class="navb">${pv!=null?`<button class="btn" onclick="go(${pv})">← Indietro</button>`:"<span></span>"}${nx!=null?`<button class="btn pri" onclick="go(${nx})">Avanti →</button>`:`<button class="btn pri" onclick="doPDF()">Genera PDF</button>`}</div>`;
  initSig()}
function soft(){runCalc();
  document.querySelectorAll("[data-n]").forEach(e=>{const n=e.dataset.n;if(e===document.activeElement)return;if(e.type==="checkbox")e.checked=!!(S[n]&&S[n]!=="Off");else if((S[n]??"")!==e.value&&e.tagName!=="SELECT")e.value=S[n]??""});
  document.querySelectorAll("[data-c]").forEach(e=>{e.value=val(e.dataset.c);e.className=e.className.replace(/\b(ok|warn|ko)\b/g,"").trim()+" "+cls(e.dataset.c)})}
function go(i){tab=i;renderAll();window.scrollTo(0,0)}
function rerender(){const y=window.scrollY;setTimeout(()=>{const a=document.activeElement,an=a&&a.dataset&&a.dataset.n;renderAll();window.scrollTo(0,y);if(an){const e=document.querySelector(`[data-n="${an}"]`);if(e)e.focus({preventScroll:true})}},0)}
const NOUP=e=>e.type==="email"||e.type==="date"||e.type==="time";
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.n||t.type==="checkbox"||t.tagName==="SELECT")return;
  if(!NOUP(t)&&t.value!==t.value.toUpperCase()){const p=t.selectionStart;t.value=t.value.toUpperCase();try{t.setSelectionRange(p,p)}catch(x){}}
  S[t.dataset.n]=t.value;save();soft()});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.r){S[t.dataset.r]=t.value;save();rerender();return}
  if(!t.dataset.n)return;const n=t.dataset.n;
  if(t.type==="checkbox")S[n]=t.checked?(CHK[n]||"Yes"):"Off";else S[n]=t.value;save();
  if(t.tagName==="SELECT"||t.type==="checkbox")rerender();else{soft();rerender()}});
document.addEventListener("click",e=>{const sv=e.target.closest("[data-sv]");if(sv){const n=sv.dataset.sv;S[n]=S[n]===sv.dataset.v?"":sv.dataset.v;save();rerender();return}
  const b=e.target.closest("[data-tri]");if(!b)return;const N=b.dataset.tri.split(","),i=+b.dataset.i,was=S[N[i]]&&S[N[i]]!=="Off";
  N.forEach((n,k)=>S[n]=k===i&&!was?(CHK[n]||"Yes"):"Off");save();rerender()});
// ---------- firme
function initSig(){document.querySelectorAll("canvas.sig").forEach(cv=>{const k=cv.dataset.sig,ctx=cv.getContext("2d"),R=2;cv.width=cv.clientWidth*R;cv.height=cv.clientHeight*R;
  const pen=()=>{ctx.lineWidth=2.6*R;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0b2a6b"};pen();
  if(sig[k]){const im=new Image();im.onload=()=>{ctx.drawImage(im,0,0,cv.width,cv.height);pen()};im.src=sig[k]}
  let dr=false,last=null;const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*R,(e.clientY-r.top)*R]};
  cv.onpointerdown=e=>{e.preventDefault();dr=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}last=pt(e);ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7);ctx.fillStyle="#0b2a6b";ctx.fill()};
  cv.onpointermove=e=>{if(!dr)return;e.preventDefault();const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p};
  const end=()=>{if(!dr)return;dr=false;sig[k]=cv.toDataURL("image/png");save()};cv.onpointerup=end;cv.onpointercancel=end;cv.onpointerleave=end})}
function clearSig(k){delete sig[k];save();const cv=document.querySelector(`canvas[data-sig="${k}"]`);if(cv)cv.getContext("2d").clearRect(0,0,cv.width,cv.height)}
let rsz;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(initSig,250)});
// ---------- salvataggio, import / export
let tm;function save(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({S,sig}));PR.push(S,KEYP)}catch(e){}},300)}
function load(){try{const t=JSON.parse(localStorage.getItem(KEY)||"null");if(t){S=t.S||{};sig=t.sig||{}}}catch(e){}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
const base=()=>SPEC.code.replace(/\W+/g,"_")+"_"+String(S[Object.keys(S).find(k=>/cliente|ute_nome|cli_nome/.test(k))]||"modulo").replace(/[^\w-]+/g,"_");
function saveJSON(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({modulo:SPEC.code,S,sig})],{type:"application/json"}));a.download=base()+".json";a.click()}
function importFile(inp){const f=inp.files[0];if(!f)return;inp.value="";
  if(/\.pdf$/i.test(f.name)||f.type==="application/pdf")return importPDF(f);
  const r=new FileReader();r.onload=()=>{try{const t=JSON.parse(r.result);S=t.S||{};sig=t.sig||{};save();renderAll();toast("Dati importati")}catch(e){alert("File non valido")}};r.readAsText(f)}
// legge un PDF compilato (es. check list ricevuta dall'installatore) e ne copia i valori nel modulo
function loadPdfLib(){return window.PDFLib?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement("script");s.src="lib/pdf-lib.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function importPDF(file){try{await loadPdfLib();const pdf=await PDFLib.PDFDocument.load(await file.arrayBuffer(),{ignoreEncryption:true});const form=pdf.getForm();let n=0;
  form.getFields().forEach(fl=>{const name=fl.getName(),L=PDFLib;let v;
    try{if(fl instanceof L.PDFTextField)v=fl.getText()||"";else if(fl instanceof L.PDFDropdown||fl instanceof L.PDFOptionList)v=(fl.getSelected()||[])[0]||"";else if(fl instanceof L.PDFCheckBox)v=fl.isChecked()?(CHK[name]||"Yes"):"Off";else if(fl instanceof L.PDFRadioGroup)v=fl.getSelected()||"";else return}catch(e){return}
    if(!(name in FD)&&!(name in CHK))return;if(CALCF.has(name))return;if(DATES.has(name))v=it2iso(v);if(v&&FD[name]&&FD[name].t!=="chk"&&FD[name].t!=="sig")v=v.toUpperCase();
    if(FD[name]&&FD[name].t==="sig")return;if(v!==""&&v!=="Off"||S[name]){S[name]=v;n++}});
  save();renderAll();toast(n+" campi importati dal PDF: controllare e completare in cantiere")}catch(e){console.error(e);alert("Impossibile leggere il PDF: "+e.message)}}
// ---------- PDF
const TPLKEY="041";
function doPDF(only){if(EXT.pdf){if(only!=="cart"&&window.FOTO&&FOTO.check&&!FOTO.check())return Promise.resolve();const FO=window.FOTO;if(only==="cart")window.FOTO=null;return EXT.pdf(only).finally(()=>{window.FOTO=FO})}if(TPLKEY&&window.PDFFILL){runCalc();const cc=only==="cart";return PDFFILL.share({key:TPLKEY,values:Object.assign({},C,S),sig:sig,mode:cc?"cart":"full",title:SPEC.title,code:SPEC.code,cliente:S.cliente||S.v_cliente||S.ragione_sociale||"",name:base()+(cc?"_cartolina":"")})}runCalc();let h=`<h1>${esc(only==="cart"?"Cartolina garanzia":SPEC.title)}</h1>`;
  const fv=f=>{if(f.t==="chk")return S[f.n]&&S[f.n]!=="Off"?"SI":"";if(f.t==="sig")return"";const v=String(val(f.n)??"");return DATES.has(f.n)?iso2it(v):v};
  SPEC.pages.forEach(pg=>{if(pageCover(pg.i))return;if(only==="cart"&&!pg.cart)return;let sec="",rows=[],pend=[],skipS=false;
    const out=()=>{if(!rows.length&&!pend.length)return;h+=`<h2>${esc(sec||SPEC.title)}</h2>`;if(rows.length){let t="<table>";for(let i=0;i<rows.length;i+=2)t+=`<tr><td>${esc(rows[i][0])}</td><td>${esc(rows[i][1])}</td><td>${esc(rows[i+1]?rows[i+1][0]:"")}</td><td>${esc(rows[i+1]?rows[i+1][1]:"")}</td></tr>`;h+=t+"</table>"}h+=pend.join("");rows=[];pend=[]};
    pg.items.forEach(it=>{if(EXT.items&&EXT.items[it.k]){const x=EXT.items[it.k].pdf?EXT.items[it.k].pdf(it):"";if(x){out();pend.push(x)}return}if(it.k==="txt"&&it.pdf){pend.push(`<p>${esc(it.t)}</p>`);return}if(it.k==="sec"){out();sec=it.t;skipS=it.cp!=null&&!!pageCover(it.cp);return}if(skipS)return;
      if(it.k==="row")it.f.forEach(f=>{if(hid(f))return;if(f.t==="sig"){if(sig[f.n])pend.push(`<table><tr><th>${esc(f.l||"Firma")}</th></tr><tr><td><img src="${sig[f.n]}"></td></tr></table>`);return}const v=fv(f);if(v)rows.push([(f.l||f.n)+(f.u?" ("+f.u+")":""),v])});
      if(it.k==="sigb"){if(hid(it.sig))return;const nm=it.nome?val(it.nome.n):"",dt=it.data?iso2it(String(val(it.data.n)||"")):"";if(!nm&&!sig[it.sig.n])return;out();if(!sec)sec="Firme";pend.push(`<table><tr><th>Firma - ${esc(it.title)}${nm?": "+esc(nm):""}${dt?" - "+esc(dt):""}</th></tr><tr><td>${sig[it.sig.n]?`<img src="${sig[it.sig.n]}">`:""}</td></tr></table>`);out();return}
      if(it.k==="uil"){if(it.cp!=null&&pageCover(it.cp))return;const N=Math.max(1,Math.min(64,parseInt(val(it.cnt))||parseInt(val(it.alt))||1)),b=i=>`s${it.s}_ui${i}_`,R2=[];for(let i=1;i<=N;i++)if(["mod","sn","ind","loc"].some(x=>S[b(i)+x]))R2.push([i].concat(["mod","sn","ind","loc"].map(x=>S[b(i)+x]||"")));if(R2.length){out();pend.push(`<table><tr><th>U.I.</th><th>Modello</th><th>Matricola</th><th>N. indirizzo</th><th>Locale / zona</th></tr>${R2.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`)}return}
      if(it.k==="tri"){const i=it.names.findIndex(n=>S[n]&&S[n]!=="Off");if(i>=0)rows.push([it.l,it.o[i]==="NV"||it.o[i]==="NA"?"N.A.":it.o[i]])}
      if(it.k==="tab"){const R=it.rows.filter(r=>r.f.some(f=>f&&!hid(f)&&fv(f)));if(R.length){out();pend.push(`<table><tr><th></th>${it.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${R.map(r=>`<tr><td>${esc(r.l)}</td>${r.f.map(f=>`<td>${esc(!f||hid(f)?"":fv(f))}</td>`).join("")}</tr>`).join("")}</table>`)}}});
    out()});
  let box=$("#pdfsrc");if(!box){box=document.createElement("div");box.id="pdfsrc";box.style.display="none";document.body.appendChild(box)}box.innerHTML=h;
  const FO=window.FOTO;if(only==="cart")window.FOTO=null;try{PDFK.share(box,{title:only==="cart"?"Cartolina garanzia":SPEC.title,code:only==="cart"&&SPEC.cartCode?SPEC.cartCode:SPEC.code,name:base()+(only==="cart"?"_cartolina":"")})}finally{window.FOTO=FO}}
load();PR.pull(S,KEYP);renderAll();
// ---------- check list: invio al tecnico e caricamento dalla pagina iniziale
let CLBYTES=null;
function nextSteps(){const c=window.TRASF&&TRASF.CL[KEYP];if(!c)return;const b=$("#nextbox");b.style.display="block";
  b.innerHTML=`<b>✓ Check list caricata.</b> I dati comuni (cliente, indirizzo, installatore, modelli e matricole) sono nella pratica corrente. Controllare i dati qui sotto, poi:<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${c.verb?`<a class="btn pri" href="${c.verb}" style="text-decoration:none">Apri ${esc(c.vt.split(" - ")[0])} precompilato</a>`:""}<button class="btn" onclick="toTech()">✉ Invia al tecnico</button></div>`}
async function toTech(){save();await new Promise(r=>setTimeout(r,350));let b=CLBYTES;if(!b&&window.PDFFILL){try{runCalc();b=await PDFFILL.make({key:TPLKEY,values:Object.assign({},C,S),sig:sig,mode:"full",title:SPEC.title,code:SPEC.code,cliente:S.cliente||""})}catch(e){b=null}}TRASF.sendTech(KEYP,b)}
if(window.TRASF&&TRASF.CL[KEYP])$("#btnTech").style.display="";
if(/[?&]import=1/.test(location.search)){try{const r=JSON.parse(sessionStorage.getItem("cl_import")||"null");sessionStorage.removeItem("cl_import");history.replaceState(null,"",location.pathname);
  if(r&&r.k===KEYP){const u=Uint8Array.from(atob(r.b),c=>c.charCodeAt(0));CLBYTES=u;S={};sig={};importPDF(new File([u],r.n||"checklist.pdf",{type:"application/pdf"})).then(nextSteps)}}catch(e){console.error(e)}}
if(/[?&]ricevuta=1/.test(location.search)){history.replaceState(null,"",location.pathname);nextSteps()}
</script>
