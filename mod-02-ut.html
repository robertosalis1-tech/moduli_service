<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Avviamento Utopia / Mini Set Free</title>
<style>

:root{--red:#e60027;--navy:#1f2b45;--blue:#3d7ab8;--txt:#1f2b45;--mut:#667085;--line:#d5dce7;--bg:#f3f5f8;--fld:#fff8c4;--ok:#16794a;--okbg:#ddf3e6;--warn:#a86400;--warnbg:#fff1d6;--ko:#c00;--kobg:#ffe1e1;--na:#eceef1}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px #0002}
.band{background:var(--red);color:#fff;font-size:12px;padding:4px 16px}
.hd{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.hd img{height:24px}
.hd h1{font-size:17px;margin:0;flex:1;min-width:200px}
.hd h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer;color:var(--navy)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
nav{max-width:1100px;margin:auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav button{border:0;background:none;padding:9px 11px;font:inherit;font-size:14px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--navy);border-color:var(--red)}
nav button i{font-style:normal;display:inline-block;min-width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle;background:#ccd}
nav button i.ok{background:var(--ok)}nav button i.warn{background:#e0a020}nav button i.ko{background:var(--ko)}
main{max-width:1100px;margin:auto;padding:14px 16px 80px}
.pane{display:none}.pane.on{display:block}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px #0001;margin:0 0 14px;overflow:hidden}
.card>h2{margin:0;padding:9px 14px;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;background:var(--blue);color:#fff}
.card.na{opacity:.55}.card.na>h2{background:#8a98aa}
.card .na-msg{padding:16px;color:var(--mut);font-style:italic;background:var(--na)}
.body{padding:12px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
label{display:block;font-size:12px;font-weight:600;color:var(--navy)}
label u{text-decoration:none;color:var(--mut);font-weight:400}
input,select,textarea{width:100%;margin-top:3px;padding:8px 9px;border:1px solid #c9d2df;border-radius:8px;font:inherit;background:var(--fld)}
.calc{background:var(--okbg)!important;border-color:#bfe3cc!important;font-weight:600;color:var(--txt)}
.calc.warn{background:var(--warnbg)!important;color:var(--warn)}.calc.ko{background:var(--kobg)!important;color:var(--ko)}.calc.ok{color:var(--ok)}
input.warn{background:#ffd99a!important;border-color:#e0a020}
input.ko{color:var(--ko);border-color:var(--ko)}input.ok{color:var(--ok)}
textarea{min-height:80px}
input.off{background:#d9dbe0!important;border-color:#d9dbe0}
.fcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.fcs button{border:3px solid transparent;border-radius:10px;padding:2px;background:#fff;cursor:pointer}
.fcs button.on{border-color:#1a73d9;box-shadow:0 0 0 3px #1a73d933}
.fcs img{width:100%;display:block}
.mors{position:relative;margin-top:10px}
.mors img{width:100%;display:block}
.mors i{position:absolute;top:-2px;bottom:-2px;border:2.5px solid;border-radius:4px}
.mors i.in{border-color:#1a73d9;background:#1a73d914}.mors i.out{border-color:#f27300;background:#f2730014}
.leg{margin-top:8px;font-size:13px}.leg span{display:inline-block;border-radius:12px;padding:3px 9px;margin:2px;font-weight:600}.leg .in{background:#e3efff;color:#0b4fa0}.leg .out{background:#ffeedd;color:#a24c00}
.tip{background:#fbe1e1;color:#8a0a0a;font-size:12.5px;font-style:italic;padding:7px 10px;border-radius:8px;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer;background:#fff}
.chip input{width:18px;height:18px;margin:0;accent-color:var(--red)}
.dips{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 24px}
.dip{display:flex;align-items:center;gap:10px}
.dip b{width:120px;font-size:13px;font-weight:600}
.dip .sw{display:flex;gap:4px}
.dip .sw span{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mut)}
.dip .sw button{width:24px;height:30px;border:1.5px solid #1f4f78;border-radius:4px;background:#0ff;cursor:pointer;padding:0;position:relative}
.dip .sw button.on{background:#1f2b45}
.dip .sw button::after{content:"";position:absolute;left:4px;right:4px;height:9px;background:#fff;border-radius:2px;bottom:3px}
.dip .sw button.on::after{top:3px;bottom:auto}
.dip.na{opacity:.35;pointer-events:none}
table{border-collapse:collapse;width:100%}
th{background:var(--blue);color:#fff;font-size:12px;text-align:left;padding:6px 7px}
td{border-bottom:1px solid var(--line);padding:3px 5px;font-size:13px}
td input{margin:0;padding:5px 6px}
td.code{font-weight:700;color:#1f4f78;white-space:nowrap}
tr.sub td{background:#e3ebf6;font-style:italic;font-weight:600;color:#1f4f78}
td.na input{background:var(--na);border-color:var(--na)}
.scroll{overflow-x:auto}
.ck{display:grid;grid-template-columns:30px 1fr repeat(3,48px);align-items:center;border-bottom:1px solid var(--line);padding:5px 0;gap:4px}
.ck .n{font-weight:700;color:var(--blue);text-align:center}.ck .t{font-size:13.5px}.ck .imp{color:var(--red);font-weight:700;font-size:11px}
.ck input{width:20px;height:20px;justify-self:center;accent-color:var(--red)}
.ck.na{opacity:.4;pointer-events:none}
.ckh{font-size:12px;font-weight:700;color:var(--mut);border-bottom:2px solid var(--line)}.ckh span{text-align:center}
.esito{padding:12px 14px;border-radius:10px;font-weight:700;font-size:16px}
.esito.ok{background:var(--okbg);color:var(--ok)}.esito.warn{background:var(--warnbg);color:var(--warn)}.esito.ko{background:var(--kobg);color:var(--ko)}.esito.none{background:var(--na);color:var(--mut)}
.esito ul{margin:6px 0 0;padding-left:18px;font-weight:500;font-size:14px}
.pill{display:inline-block;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;background:var(--na);color:var(--mut)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.ko{background:var(--kobg);color:var(--ko)}
.sig{border:1px dashed #9aa6b8;border-radius:10px;background:#fff;touch-action:none;width:100%;height:140px;display:block}
.navb{display:flex;justify-content:space-between;margin-top:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;z-index:50}
.toast.on{opacity:1}
#print{display:none}
@media print{
  header,main,.toast{display:none!important}
  #print{display:block;font:9.5pt/1.3 Helvetica,Arial,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .pband{background:#e60027;color:#fff;font-size:8pt;padding:3pt 6pt;margin:4pt 0}
  #print h1{font-size:15pt;margin:2pt 0}
  #print h2{font-size:10pt;background:#3d7ab8;color:#fff;padding:3pt 6pt;margin:9pt 0 3pt;text-transform:uppercase}
  #print table{width:100%;border-collapse:collapse;margin:2pt 0 5pt}
  #print th{background:#e3ebf6;color:#1f2b45;border:1px solid #aab;font-size:7.5pt;padding:2pt 3pt;text-align:left}
  #print td{border:1px solid #ccd;font-size:8pt;padding:2pt 4pt}
  #print .pb{page-break-before:always}
  #print .es{padding:5pt;font-weight:700;border:1px solid #999}
  @page{size:A4;margin:11mm}
}

.kind{display:flex;gap:8px;flex-wrap:wrap}
.kind button{flex:1;min-width:150px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:700;color:var(--navy);cursor:pointer}
.kind button.on{border-color:var(--red);box-shadow:0 0 0 3px #e6002722}
select.hl,input.hl{background:#ffe600!important;border:2.5px solid #ff8c00!important}
.calc.hl{background:#ffe600!important;color:#a00!important;border-color:#ff8c00!important}
.uband{background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-weight:700;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.uband span{font-weight:400;opacity:.85}
.units td{white-space:nowrap}
.units tr.ue td{background:#dbe8f6;font-weight:700}
.units td input{min-width:110px}
.gauges{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.gauges svg{width:150px;height:150px}
.seg{display:inline-flex;background:#1e1e21;border-radius:4px;padding:3px 5px;gap:3px;vertical-align:middle}
.seg svg{width:11px;height:19px}
details.sat{background:#fff7ec;border:1px solid #f0c27a;border-radius:12px;margin:0 0 14px}
details.sat summary{padding:10px 14px;font-weight:700;color:#8a4b00;cursor:pointer}
details.sat .body{padding-top:0}
.ck{grid-template-columns:28px 1fr repeat(3,44px)}
.mailrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
header{position:static!important;box-shadow:none!important}
.navw{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 4px #0002}
.navw nav{padding-top:env(safe-area-inset-top)}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
@media (max-width:600px){.band{font-size:10px;padding:2px 10px}.band b{display:none}.hd{gap:6px;padding:6px 10px}.hd img{height:16px}.hd h1{font-size:14px;min-width:0;flex:1 1 60%}.hd h1 small{display:none}.hd .btn{padding:4px 8px;font-size:12px}.hd .pill{font-size:10px;padding:3px 7px}nav button{padding:7px 9px;font-size:13px}main{padding:10px 10px 90px}.body{padding:10px}.hd h1{font-size:15px}.btn.sm{padding:5px 8px}.grid{grid-template-columns:1fr 1fr}.grid label{min-width:0}}
@media (max-height:500px){.band{font-size:10px;padding:2px 10px}.band b{display:none}.hd{gap:6px;padding:6px 10px}.hd img{height:16px}.hd h1{font-size:14px;min-width:0;flex:1 1 60%}.hd h1 small{display:none}.hd .btn{padding:4px 8px;font-size:12px}.hd .pill{font-size:10px;padding:3px 7px}nav button{padding:7px 9px;font-size:13px}main{padding:10px 10px 90px}.body{padding:10px}.hd h1{font-size:15px}.btn.sm{padding:5px 8px}.grid{grid-template-columns:1fr 1fr}.grid label{min-width:0}}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
@media print{.navw{display:none!important}}
</style>

ure", true], ["Carica aggiuntiva scritta sull'etichetta dell'unità esterna e dichiarata in Banca Dati F-gas", false], ["Alimentazioni con protezioni dedicate, sezione cavi conforme, morsetti serrati", true], ["Cavo H-LINK schermato, separato dai cavi di potenza, resistenza terminale impostata su una sola unità", false], ["Indirizzi RSW / DSW impostati, U.I. rilevate uguali alle dichiarate", true], ["Scarico condensa delle unità interne provato con acqua", true], ["Prova in raffreddamento eseguita per almeno 30 minuti con funzionamento stabile", false], ["Prova in riscaldamento eseguita per almeno 30 minuti con funzionamento stabile", false], ["A fine prova nessun allarme attivo sul comando e sul display a 7 segmenti", true], ["Comandi configurati e cliente istruito su uso, filtri, manutenzione e allarmi", false]], "PREALL": [["", ""], ["p1", "Controllo rapporto di pressione: rapporto di compressione fuori campo, frequenza corretta"], ["p2", "Protezione Pd (alta pressione): frequenza ridotta (batteria sporca? ricircolo aria? carica eccessiva?)"], ["p3", "Protezione corrente: corrente oltre il limite, frequenza ridotta"], ["P4", "Temperatura aletta inverter alta: verificare ventilazione e spazi della U.E."], ["p5", "Protezione aumento Td (gas di scarico): carica scarsa? valvola di espansione?"], ["pA", "Controllo di richiesta (demand): limitazione da segnale esterno"], ["p9", "Protezione diminuzione Pd: alta pressione bassa, frequenza aumentata"], ["P7", "Ripetizione scatto inverter"], ["P8", "Tensione insufficiente / ritento rilevamento fase aperta"]], "LIQ": ["", "1/4\"", "3/8\"", "1/2\"", "5/8\"", "3/4\""], "GASD": ["", "1/2\"", "5/8\"", "3/4\"", "7/8\"", "1\"", "1 1/8\""], "SPAZI": [200, 50, 100, 300, null], "PROC": {"UT3": "RAS-3HVRC2: entrare con PSW1 premuto 3 s; PSW2 = avanti, PSW3 = indietro; uscire con PSW1 premuto 3 s.", "UT": "RAS-(4-6)H(V)(R/N)(C/P)2E: entrare con PSW2 premuto 3 s; PSW2 = avanti, PSW3 = indietro; uscire con PSW2 premuto 3 s.", "MS": "RAS-(4-6)FS(V)NME: entrare con PSW1 premuto 3 s; PSW2 (giù) = avanti, PSW3 (su) = indietro; uscire con PSW1 premuto 3 s.", "MSX": "RAS-(8-12)FSXNME: entrare con PSW1 premuto 3 s; PSW4 (giù) = avanti, PSW2 (su) = indietro; PSW3 / PSW5 cambiano gruppo (A connessione, B unità esterna, C unità interne, D cause allarme, E storico); uscire con PSW1 premuto 3 s."}, "ISTR": {"ut": [["Carica refrigerante Utopia (SMIT0136 par. 3.4.3 - 3.4.4)", "Carica di fabbrica W0 per 20 m di linea. **RAS-3HVRC2:** W0 1,7 kg, P 45 g/m da catalogo TCIT0136 (il manuale SMIT0136 riporta 30 g/m: verificare la targhetta), max aggiuntiva 0,9 kg. **RAS-(4-6)HV(R)(C/P)2E R32:** W0 3,0 kg, P 45 g/m, max aggiuntiva 2,9 kg. **RAS-(4-6)H(V)N(C/P)2E R410A:** W0 3,2 kg, P 60 g/m, max aggiuntiva 3,9 kg.", "**Calcolo:** W1 = (TL - 20 m) x P; carica totale WTOT = W0 + W1. Non superare la carica massima aggiuntiva. Con linea sotto 5 m contattare BHC. Con diametro liquido diverso dal nominale 3/8\" il modulo ricalcola P in proporzione al volume del tubo (1/4\" circa 0,38 x P, 1/2\" circa 1,9 x P): verificare con il manuale."], ["Prova di tenuta, vuoto e carica (SMIT0136 par. 3.4)", "1) Prova di tenuta con azoto anidro fino a **4,15 MPa** sugli attacchi a cartella e sulle brasature. 2) Vuoto per 1-2 ore fino a meno di 756 mmHg (obiettivo del modulo: **500 micron o meno**). 3) Collegare il collettore al giunto della **valvola di arresto del liquido** con la bombola; aprire completamente la valvola del gas e leggermente quella del liquido. 4) Caricare il refrigerante calcolato (tolleranza +/-0,5 kg) facendo funzionare il sistema in raffreddamento. 5) Aprire completamente la valvola del liquido e far funzionare in raffreddamento per almeno 10 minuti. 6) Scrivere la carica aggiuntiva sull'etichetta dell'U.E. e in Banca Dati F-gas."], ["Lettura pressioni ai giunti di ritegno (SMIT0136 par. 3.4.1)", "Giunto valvola di arresto **gas (A)**: bassa pressione in raffreddamento, alta in riscaldamento. Giunto sulla **linea (B)**: alta in raffreddamento, bassa in riscaldamento. Giunto valvola di arresto **liquido (C)**: solo per vuoto e carica. Attenzione a non spruzzare olio o refrigerante sulle parti elettriche staccando i flessibili."]], "ms": [["Carica refrigerante Mini Set Free (TCIT0124 / SMIT0124)", "Carica di fabbrica W0 (TCIT0124, \"quantità di refrigerante caricata in fabbrica\"): **RAS-4FS(V)NME 3,7 kg - RAS-5/6FS(V)NME 4,1 kg - RAS-8FSXNME 4,2 kg - RAS-10/12FSXNME 5,5 kg.**", "**Calcolo:** carica aggiuntiva = linea principale + diramazioni, ciascuna lunghezza del liquido per i kg/m del proprio diametro (valori standard Set Free R410A: 1/4\" 0,03 - 3/8\" 0,07 - 1/2\" 0,12 - 5/8\" 0,19 - 3/4\" 0,28 kg/m, da confermare sul manuale di installazione). Carica totale = W0 + aggiuntiva. La carica massima aggiuntiva va scritta dal manuale di installazione dell'U.E."], ["Come caricare (SMIT0124 par. 10.2)", "Caricare il refrigerante aggiuntivo **dal giunto di ritegno della valvola di arresto del liquido** durante il raffreddamento, con la valvola del liquido **leggermente aperta** (se è tutta aperta la carica è difficile). **Non caricare mai dalla valvola del gas.** Una carica insufficiente porta all'allarme 08 (Td alta) e al danneggiamento del compressore."], ["Vuoto e prova di tenuta su 8-12 HP (SMIT0124 par. 6.6)", "Usare la **modalità di apertura forzata delle valvole**: apre EVO, EVB, SVA dell'U.E. ed EVI delle U.I. per recupero, vuoto e prova di tenuta. U.E. e U.I. devono essere alimentate. Non usarla per altri scopi; ventilatori fermi durante la modalità e per 50 s dopo."]], "common": [["Più unità esterne, H-LINK e Service Tool", "Con più U.E. sullo stesso bus H-LINK ogni U.E. mostra in **AA** le U.I. del proprio ciclo: la **somma dei valori AA** (o il valore AA uguale su tutte, se il sistema li conta insieme) deve essere uguale al **totale delle U.I. dichiarate**. Indirizzi: ciclo refrigerante (RSW U.E.) diverso per ogni U.E., numeri U.I. non duplicati (allarme 35). Resistenza terminale attiva su una sola unità per bus.", "Con **più di 8 U.I. o più di 2 U.E.** collegare l'**Hitachi Service Tool**, registrare almeno 30 minuti di funzionamento stabile per modalità e **allegare la registrazione** al verbale (il modulo lo chiede in automatico)."]]}, "MANY": {"ui": 8, "ue": 2}};
