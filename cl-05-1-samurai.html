NO", "NA"], "names": ["q17_SI", "q17_NO", "q17_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 661, 490, 671], "l": "Il vaso di espansione è dimensionato per il contenuto d'acqua (con glicole) e la precarica è stata verificata?"}, {"k": "txt", "t": "La pompa di circolazione (o il kit idronico) garantisce la portata dell'unità entro il range del manuale, considerando"}, {"k": "tri", "base": "q18", "o": ["SI", "NO", "NA"], "names": ["q18_SI", "q18_NO", "q18_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 688, 490, 698], "l": "le perdite di carico dell'impianto? (Samurai S: pompa di serie con prevalenza utile 150 / 130 / 120 / 110 kPa per 4 / 5 / 6 / 7 HP)"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "tri", "base": "q19", "o": ["SI", "NO", "NA"], "names": ["q19_SI", "q19_NO", "q19_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 715, 490, 725], "l": "Con più moduli in parallelo sono installate valvole di bilanciamento per equilibrare la portata di ogni modulo?"}, {"k": "tri", "base": "q20", "o": ["SI", "NO", "NA"], "names": ["q20_SI", "q20_NO", "q20_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 737, 490, 747], "l": "Con circuito secondario o portate diverse tra generatore e utenze è presente un separatore idraulico (o compensatore)?"}, {"k": "tri", "base": "q21", "o": ["SI", "NO", "NA"], "names": ["q21_SI", "q21_NO", "q21_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 764, 490, 774], "l": "Le tubazioni sono isolate (anticondensa in raffreddamento; spessori secondo normativa per tubazioni esterne o in locali non riscaldati)?"}]}, {"i": 2, "items": [{"k": "txt", "t": "Verifica (segue) N.A."}, {"k": "txt", "t": "Lo scarico della valvola di sicurezza del circuito acqua è convogliato secondo normativa? (Samurai S: valvola 6"}, {"k": "tri", "base": "q22", "o": ["SI", "NO", "NA"], "names": ["q22_SI", "q22_NO", "q22_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 118, 490, 129], "l": "bar e gruppo di carico automatico forniti sciolti, da inst "tx", "l": "Cloruri", "u": "ppm"}]}, {"k": "row", "f": [{"n": "w_esito", "r": [235, 298, 550, 311], "p": 2, "t": "calc", "l": "Esito qualità acqua"}]}, {"k": "tip", "t": "Volume minimo: Samurai M comfort 3,3 l/kW e processo 6,5 l/kW (manuale par. 3.6); Samurai S 45 l (4 HP) e 55 l (5-7 HP); Samurai L valore di listino; per il processo almeno 6,5 l/kW. Pressione acqua: minima 0,3 bar, massima 3 bar (apertura valvola di sicurezza; Samurai S 6 bar). Glicole: obbligatorio con acqua in uscita sotto +5 °C (consigliato etilenico, massimo 45%, solo inibito). Qualità acqua (par. 10.4): pH 7,5-8,0, durezza 4,8-8,5 °dH, cloruri < 50 ppm."}, {"k": "sec", "t": "3 - PARTE ELETTRICA E COMUNICAZIONE"}, {"k": "txt", "t": "Verifica N.A."}, {"k": "txt", "t": "Ogni modulo ha una linea dedicata protetta singolarmente (Samurai M e L: 400 V trifase, attestata sull'interruttore"}, {"k": "tri", "base": "q29", "o": ["SI", "NO", "NA"], "names": ["q29_SI", "q29_NO", "q29_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 405, 490, 416], "l": "generale -QMCB con capicorda; Samurai S: 230 V monofase, cavo 4 mm2 per 4 HP e 6 mm2 per 5-7 HP, interruttore curva D 40 A (4 HP) o 50 A (5-7 HP) 2P)?"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "tri", "base": "q30", "o": ["SI", "NO", "NA"], "names": ["q30_SI", "q30_NO", "q30_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 437, 490, 448], "l": "I cavi di alimentazione sono dimensionati per la corrente massima (tabella dati di riferimento o targhetta)?"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "tri", "base": "q31", "o": ["SI", "NO", "NA"], "names": ["q31_SI", "q31_NO", "q31_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 464, 490, 475], "l": "Non sono presenti collegamenti entra-esci o derivazioni di altri circuiti dai morsetti dell'interruttore generale dell'unità?"}, {"k": "tri", "base": "q32", "o": ["SI", "NO", "NA"], "names": ["q32_SI", "q32_NO", "q32_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 486, 490, 497], "l": "Tutti i moduli hanno collegamenti equipotenziali e sono collegati alla stessa rete di terra?"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "tri", "base": "q33", "o": ["SI", "NO", "NA"], "names": ["q33_SI", "q33_NO", "q33_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 508, 490, 519], "l": "La tensione di alimentazione è nei limiti (400 V trifase: 360-440 V con squilibrio tra le fasi max 2%; 230 V monofase: 207-253 V)?"}, {"k": "tri", "base": "q34", "o": ["SI", "NO", "NA"], "names": ["q34_SI", "q34_NO", "q34_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 535, 490, 546], "l": "L'unità rimarrà sempre alimentata nella stagione fredda (protezioni antigelo)? L'unità è alimentata da almeno 24 ore prima dell'avviamento (riscaldatori carter)?"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "tri", "base": "q35", "o": ["SI", "NO", "NA"], "names": ["q35_SI", "q35_NO", "q35_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 557, 490, 568], "l": "Samurai M: l'interblocco pompa esterno (XTB2 - DI8, morsetti 80H-88) è collegato o ponticellato?"}, {"k": "tri", "base": "q36", "o": ["SI", "NO", "NA"], "names": ["q36_SI", "q36_NO", "q36_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 579, 490, 590], "l": "Con pompa esterna il comando è collegato al contatto pulito di comando pompa (Samurai M: KWP morsetti 21-22, max 1 A)?"}, {"k": "tri", "base": "q37", "o": ["SI", "NO", "NA"], "names": ["q37_SI", "q37_NO", "q37_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 606, 490, 617], "l": "On/off remoto, cambio stagionale e uscita allarme sono collegati come da progetto (Samurai M: DI7, DI6, KAL morsetti 23-24)?"}, {"k": "txt", "t": "Sistemi in cascata (S fino a 4, M fino a 16, L fino a 8 moduli): i moduli sono collegati con cavo RS485 twistato"}, {"k": "tri", "base": "q38", "o": ["SI", "NO", "NA"], "names": ["q38_SI", "q38_NO", "q38_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 638, 490, 649], "l": "schermato in configurazione entra-esci (Samurai M: 1x2x0,22 mm2, 120 Ohm, porta CN204, lunghezza totale < 100 m)?"}, {"k": "tri", "base": "q39", "o": ["SI", "NO", "NA"], "names": ["q39_SI", "q39_NO", "q39_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 670, 490, 681], "l": "Sistemi in cascata: è installata la sonda di temperatura comune (Samurai M: ingresso AI6 del master; Samurai S: sonda CHL-MOD-02)?"}, {"k": "tri", "base": "q40", "o": ["SI", "NO", "NA"], "names": ["q40_SI", "q40_NO", "q40_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 697, 490, 708], "l": "Il pannello di comando remoto è cablato con cavo schermato nei limiti di distanza (Samurai S: max 15 m; Samurai M: 20 m alimentato dal chiller, 500 m con alimentatore 12 V DC)?"}]}, {"i": 3, "items": [{"k": "sec", "t": "4 - SAMURAI M CON REFRIGERANTE R454B (RHMA ...AX)"}, {"k": "row", "f": [{"n": "r454_flag", "r": [235, 116, 550, 129], "p": 3, "t": "calc", "l": "Sono presenti moduli R454B?"}]}, {"k": "txt", "t": "R454B - REFRIGERANTE LEGGERMENTE INFIAMMABILE (A2L)"}, {"k": "sec", "t": "!"}, {"k": "txt", "t": "Le unità RHMA ...AX contengono R454B (classe A2L secondo ISO 817 / EN 378, GWP 466) con densità superiore all'aria : in caso di perdita il gas può ristagnare a quote inferiori al piano dell'unità. Le unità sono dotate di sensori di perdita (NDIR) e di ventilazione del quadro ; le valvole di sicurezza del circuito frigorifero scaricano tramite tubazioni fornite sciolte, da montare a cura dell'installatore (manuale par. 2.7 e 9.11-9.14)."}, {"k": "txt", "t": "Le unità R454B vanno installate all'aperto , non in seminterrati o locali interrati non conformi alla EN 378-3:2021 par. 5. scarico delle valvole di sicurezza va convogliato all'aperto, ad almeno 1 m dal suolo e con la bocca verso l'alto ; la zona attorno allo scarico è classificata zona 2 (EN 60079-10-1): entro 1,2 m in tutte le direzioni non devono esserci fonti di innesco né aperture verso l'edificio."}, {"k": "txt", "t": "Zona entro 1,2 m dallo scarico delle valvole di sicurezza - rispondere SI se l'elemento è ASSENTE: N.A."}, {"k": "tri", "base": "q41", "o": ["SI", "NO", "NA"], "names": ["q41_SI", "q41_NO", "q41_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 299, 490, 310], "l": "Fonti di innesco: fiamme libere, impianti e quadri elettrici, prese, interruttori, lampade, superfici calde, apparecchi che producono scintille"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "tri", "base": "q42", "o": ["SI", "NO", "NA"], "names": ["q42_SI", "q42_NO", "q42_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 326, 490, 337], "l": "Porte, finestre, lucernari, prese d'aria, griglie di ventilazione o altre aperture verso l'interno dell'edificio"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "tri", "base": "q43", "o": ["SI", "NO", "NA"], "names": ["q43_SI", "q43_NO", "q43_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 353, 490, 364], "l": "Bocche di lupo, griglie, intercapedini, scale o accessi a locali interrati e qualsiasi punto più basso in cui il gas può ristagnare"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "tri", "base": "q44", "o": ["SI", "NO", "NA"], "names": ["q44_SI", "q44_NO", "q44_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 375, 490, 386], "l": "Fognature, tombini, pozzetti, caditoie e scarichi"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "txt", "t": "Installazione unità R454B N.A."}, {"k": "tri", "base": "q45", "o": ["SI", "NO", "NA"], "names": ["q45_SI", "q45_NO", "q45_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 412, 490, 423], "l": "L'unità è installata all'aperto, lontano da grigliati, bocche di lupo e zone in cui il gas può ristagnare, e in caso di perdita il refrigerante non può entrare nell'edificio (porte, botole, bocche di ventilazione)?"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "txt", "t": "Le tubazioni di scarico delle valvole di sicurezza (attacco 7/8-14UNF) sono montate e convogliate all'aperto, ad"}, {"k": "tri", "base": "q46", "o": ["SI", "NO", "NA"], "names": ["q46_SI", "q46_NO", "q46_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 444, 490, 455], "l": "almeno 1 m dal suolo, con bocca verso l'alto, libere da ostruzioni? Le valvole di alta e bassa pressione NON scaricano nello stesso condotto?"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "tri", "base": "q47", "o": ["SI", "NO", "NA"], "names": ["q47_SI", "q47_NO", "q47_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 476, 490, 487], "l": "Se il convogliamento supera la lunghezza del kit di serie, il diametro della tubazione è stato calcolato (D^5 = 1,447 x L, EN 13136)?"}, {"k": "tri", "base": "q48", "o": ["SI", "NO", "NA"], "names": ["q48_SI", "q48_NO", "q48_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 503, 490, 514], "l": "Se l'unità è in un vano tecnico o sotto riparo è garantita una ventilazione naturale o forzata adeguata, ed è stata eseguita la valutazione dei rischi del luogo di installazione (EN 378, EN 60079-10-1)?"}, {"k": "txt", "t": "IMPORTANTE"}, {"k": "tri", "base": "q49", "o": ["SI", "NO", "NA"], "names": ["q49_SI", "q49_NO", "q49_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 530, 490, 541], "l": "Dove richiesto dalla valutazione dei rischi è installato un sistema di rilevazione e allarme fughe omologato per R454B (accessorio non fornito da Hitachi)?"}, {"k": "tri", "base": "q50", "o": ["SI", "NO", "NA"], "names": ["q50_SI", "q50_NO", "q50_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 552, 490, 563], "l": "Il quadro elettrico non è stato forato né modificato e i cavi entrano tramite le piastre e i pressacavi previsti?"}, {"k": "tri", "base": "q51", "o": ["SI", "NO", "NA"], "names": ["q51_SI", "q51_NO", "q51_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 574, 490, 585], "l": "L'unità è lontana da sorgenti di correnti vaganti (linee ferroviarie elettriche, grandi impianti di saldatura, forni a induzione, protezione catodica)?"}, {"k": "tri", "base": "q52", "o": ["SI", "NO", "NA"], "names": ["q52_SI", "q52_NO", "q52_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 596, 490, 607], "l": "Le distanze tra i impianti idraulico ed elettrico ai sensi del D.M. 37/08?"}, {"k": "row", "f": [{"n": "dm_idr_data", "r": [210, 148, 334, 161], "p": 4, "t": "tx", "date": 1, "l": "Data dichiarazione impianto idraulico"}, {"n": "dm_idr_sogg", "r": [409, 148, 550, 161], "p": 4, "t": "tx", "l": "Impresa dichiarante"}]}, {"k": "row", "f": [{"n": "dm_ele_data", "r": [210, 167, 334, 180], "p": 4, "t": "tx", "date": 1, "l": "Data dichiarazione impianto elettrico"}, {"n": "dm_ele_sogg", "r": [409, 167, 550, 180], "p": 4, "t": "tx", "l": "Impresa dichiarante"}]}, {"k": "tip", "t": "Le informazioni di questo modulo sono dichiarate dalla ditta installatrice. Le verifiche del SAT riguardano il corretto funzionamento delle unità Hitachi e non costituiscono attestazione di conformità dell'impianto. Il rispetto di UNI EN 378, EN 60079-10-1, D.M. 37/08, Reg. (UE) 2024/573 (F-gas) e delle norme di prevenzione incendi resta a carico della ditta installatrice e del proprietario dell'impianto."}, {"k": "sec", "t": "ACCETTAZIONE CLAUSOLA E INVIO AL SAT"}, {"k": "txt", "t": "CLAUSOLA DI ADDEBITO PER MANCATO PRIMO AVVIAMENTO"}, {"k": "sec", "t": "!"}, {"k": "txt", "t": "Nel caso in cui il SAT non potesse effettuare il primo avviamento per mancanza o negligenza da parte della ditta installatrice che non avesse effettuato tutte le lavorazioni necessarie, le ore perse saranno addebitate all'installatore stesso , alle tariffe Service Hitachi vigenti alla data di attivazione dell'impianto ( 28 €/h per il tecnico 0,50 €/km per le percorrenze effettuate"}, {"k": "txt", "t": "Il SAT dovrà necessariamente compilare il modulo intervento giustificando le motivazioni del mancato avviamento."}, {"k": "txt", "t": "ESEMPIO"}, {"k": "tip", "t": "il SAT percorre 100 km in un'ora per andare sull'impianto, arriva e l'impianto ha grossi problemi tipo perdite sulle linee o vuoto insufficiente, perde un'ora sul cantiere e rientra percorrendo la stessa distanza nello stesso tempo. All'installatore verranno fatturate 3 ore e 1 r v = smV(d, 'm' + r + '_mod'), m, i, o;\n  if ((m = /RHMA (\\d+)AVN/.exec(v))) {\n    i = smIdx(SM.sHp, parseInt(m[1], 10)); if (i < 0) return null;\n    o = { fam: 'S', ref: 'R410A', gwp: 2088, circ: 1, ch: SM.sCh[i], kw: SM.sKw[i], i: i, mono: true };\n    o.qn = SM.sQ[i]; o.qmin = SM.sQmin[i]; o.qmax = SM.sQmax[i]; o.vc = SM.sV[i]; o.vp = Math.max(SM.sV[i], Math.round(o.kw * 6.5)); o.imax = SM.sI[i]; o.mod = 'RHMA ' + m[1] + 'AVN';\n    return o;\n  }\n  if ((m = /RHMA (\\d+)A([NX])/.exec(v))) {\n    i = smIdx(SM.hp, parseInt(m[1], 10)); if (i < 0) return null;\n    var x = m[2] == 'X', k = smK(d, r);\n    o = { fam: 'M', ref: x ? 'R454B' : 'R410A', gwp: x ? 466 : 2088, circ: SM.circ[i], ch: x ? SM.chX[i] : SM.chN[i], kw: x ? SM.kwX[i] : SM.kwN[i], i: i };\n    o.qn = SM.qc[i] * 3.6; o.qh = SM.qh[i] * 3.6; o.qmin = SM.qmin[i] * 3.6; o.qmax = SM.qmax[i] * 3.6; o.vc = SM.vc[i]; o.vp = SM.vp[i];\n    o.imax = (x ? (k ? SM.imXk : SM.imX) : (k ? SM.imNk : SM.imN))[i]; o.dpn = (x ? SM.dpX : SM.dpN)[i]; o.att = SM.att[i];\n    o.mod = 'RHMA ' + m[1] + 'A' + m[2];\n    return o;\n  }\n  if ((m = /RCME (\\d+)WH1 \\((R\\d+A)\\)/.exec(v))) {\n    i = smIdx(SM.lHp, parseInt(m[1], 10)); if (i < 0) return null;\n    o = { fam: 'L', ref: m[2], gwp: m[2] == 'R513A' ? 631 : 1430, circ: 1, ch: m[2] == 'R134A' ? SM.lCh134[i] : NaN, kw: SM.lKw[i], i: i };\n    o.qn = SM.lQe[i]; o.qmin = SM.lQmin[i]; o.qmax = SM.lQmax[i]; o.qcmax = SM.lQcMax[i]; o.vc = SM.lVc[i]; o.vp = Math.max(SM.lVc[i], Math.round(SM.lKw[i] * 6.5));\n    o.qcond = (m[2] == 'R513A' ? SM.lQc513 : SM.lQc134)[i]; o.mod = 'RCME ' + m[1] + 'WH1';\n    return o;\n  }\n  return null;\n}\nfunction smCO2(o) { return (o && !isNaN(o.ch)) ? o.ch * o.gwp / 1000 : NaN; }\nfunction smMod(d, r, what) {\n  var o = smInfo(d, r); EV.target.textColor = ['RGB', 0, 0, 0];\n  if (!o) return '';\n  if (what == 'ref') return o.ref + (o.fam == 'M' && o.ref == 'R454B' ? ' (A2L)' : '');\n  if (what == 'circ') return String(o.circ);\n  if (wh const cls=n=>{const b=COL[n+"#bg"];if(b&&b[0]==="RGB"){if(b[1]>0.95&&b[2]<0.9&&b[3]<0.9)return"ko";if(b[1]>0.95&&b[2]>0.85&&b[3]<0.8)return"warn";if(b[2]>0.9&&b[1]<0.9)return"ok"}
  const c=COL[n];if(!c||c[0]!=="RGB")return"";if(c[1]>0.6&&c[2]<0.2)return"ko";if(c[1]>0.6&&c[2]>0.3&&c[3]<0.2)return"warn";if(c[2]>0.35&&c[1]<0.2)return"ok";return""};
const val=n=>C[n]??S[n]??"";
// ---------- coperture (sezioni non applicabili)
const PGAREA=595*842;
function covered(f){if(!f||!f.r)return false;return SPEC.covers.some(c=>c.p===f.p&&DISP[c.n]!==1&&f.r[0]>=c.r[0]-2&&f.r[2]<=c.r[2]+2&&f.r[1]>=c.r[1]-2&&f.r[3]<=c.r[3]+2)}
function pageCover(pi){return SPEC.covers.find(c=>c.p===pi&&DISP[c.n]!==1&&(c.r[2]-c.r[0])*(c.r[3]-c.r[1])>PGAREA*0.55)}
const hid=f=>DISP[f.n]===1||covered(f);
// ---------- costruttori
const tipH=t=>`<div class="tip">i &nbsp;${esc(t)}</div>`;
function inputH(f,bare){const n=f.n,v=S[n]??"",l=esc(f.l||"")+(f.u?` <u>(${esc(f.u)})</u>`:"");const ro=RO[n]?" disabled":"";
  let h;
  if(f.t==="calc")h=String(val(n)).length>40||/\n/.test(val(n))?`<textarea readonly rows="${Math.min(6,Math.max(2,Math.ceil(String(val(n)).length/40)))}" class="calc ${cls(n)}" data-c="${n}" style="min-height:0;resize:none">${esc(val(n))}</textarea>`:`<input readonly class="calc ${cls(n)}" data-c="${n}" value="${esc(val(n))}">`;
  else if(f.t==="sel"&&(f.o||[]).length<=5&&(f.o||[]).every(x=>["","SI","NO","NV","NA","N.A.","OK","KO"].includes(x))&&!ITEMS[n]){const O=f.o.filter(Boolean);h=`<div class="seg2">${O.map(o=>`<button type="button" class="${v===o?"on"+(o==="NO"||o==="KO"?" no":""):""}" data-sv="${n}" data-v="${o}">${o==="NV"||o==="NA"?"N.A.":o}</button>`).join("")}</div>`;return bare?h:`<div class="tri" style="grid-column:1/-1"><div class="q">${l}</div>${h}</div>`}
  else if(f.t==="sel"){const o=(ITEMS[n]||f.o||[""]).map(x=>Array.isArray(x)?x[0]:x);h=`<select data-n="${n}"${ro}>${(o.includes(v)?o:o.concat([v])).map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}</select>`}
  else if(f.t==="combo"){const o=(ITEMS[n]||f.o||[]).map(x=>Array.isArray(x)?x[0]:x).filter(Boolean);h=`<input data-n="${n}" list="dl_${n}" autocomplete="off" value="${esc(v)}"${ro}><datalist id="dl_${n}">${o.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`}
  else if(f.t==="chk")return `<label class="chkf"${bare?"":' style="grid-column:1/-1"'}><input type="checkbox" data-n="${n}" ${S[n]&&S[n]!=="Off"?"checked":""}${ro}>${bare?"":esc(f.l||"")}</label>`;
  else if(f.t==="radio"){const F=FD[n];return `<div class="chips" style="grid-column:1/-1">${F.ons.map(o=>`<label class="chip"><input type="radio" name="r_${n}" data-r="${n}" value="${esc(o)}" ${S[n]===o?"checked":""}>${esc(o)}</label>`).join("")}</div>`}
  else if(f.t==="area")h=`<textarea data-n="${n}"${ro}>${esc(v)}</textarea>`;
  else if(f.t==="sig")return `<div class="sigs" style="grid-column:1/-1"><div style="font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px">${esc(f.l||"Firma")}</div><canvas class="sig" data-sig="${n}"></canvas><div class="sigw" style="display:flex;gap:6px;align-items:center;margin-top:6px"><small style="flex:1;color:var(--mut)">Firmare con il dito, la penna o il mouse</small><button class="btn sm" onclick="clearSig('${n}')">Cancella</button></div></div>`;
  else h=`<input data-n="${n}" type="${f.date?"date":/mail/i.test(n)?"email":"text"}" value="${esc(v)}"${ro}${/(_v\d|_l\d|_w|tens|_t[a-z]|kg|ohm|hlink|vuoto|press|_p[ab]|^p_|num|_n$|_h\d?$)/i.test(n)?' inputmode="decimal"':""}>`;
  return bare?h:`<label${f.t==="area"||f.t==="calc"&&String(val(n)).length>40?' style="grid-column:1/-1"':""}>${l}${h}</label>`}
function itemH(it){
  if(it.k==="sec")return null;
  if(it.k==="txt")return `<div class="txt">${esc(it.t)}</div>`;
  if(it.k==="tip")return tipH(it.t);
  if(it.k==="row"){const F=it.f.filter(f=>!hid(f));if(!F.length)return"";if(F.length===1&&F[0].t==="sig")return inputH(F[0]);
    return `<div class="grid" style="margin:6px 0">${F.map(f=>inputH(f)).join("")}</div>`}
  if(it.k==="tri"){if(it.names.every(n=>DISP[n]===1)||covered(FD[it.names[0]]))return"";const cur=it.names.findIndex(n=>S[n]&&S[n]!=="Off");
    return `<div class="tri"><div class="q">${esc(it.l)}</div><div class="seg2">${it.o.map((o,i)=>`<button class="${i===cur?"on"+(o==="NO"||o==="KO"?" no":""):""}" data-tri="${it.names.join(",")}" data-i="${i}">${o==="NV"||o==="NA"?"N.A.":o}</button>`).join("")}</div></div>`}
  if(it.k==="tab"){const R=it.rows.filter(r=>r.f.some(f=>!hid(f)));if(!R.length)return"";
    const vis=it.cols.map((c,ci)=>R.some(r=>r.f[ci]&&!hid(r.f[ci])));
    return `<div class="scroll" style="margin:8px 0"><table class="ftab"><tr><th></th>${it.cols.map((c,ci)=>vis[ci]?`<th>${esc(c)}</th>`:"").join("")}</tr>${R.map(r=>`<tr><td class="rl">${esc(r.l)}</td>${r.f.map((f,ci)=>vis[ci]?`<td>${hid(f)?"":inputH(f,true)}</td>`:"").join("")}</tr>`).join("")}</table></div>`}
  return ""}
function pageH(pg){const pc=pageCover(pg.i);if(pc)return `<div class="covmsg">${esc(pc.msg.trim())}</div>`;
  let h="",open=false,body="";const flush=()=>{if(open||body.trim())h+=`<section class="card">${open?`<h2>${esc(open)}</h2>`:""}<div class="body">${body}</div></section>`;body=""};
  pg.items.forEach(it=>{if(it.k==="sec"){flush();open=it.t}else{const x=itemH(it);if(x)body+=x}});flush();return h}
const pageTitle=pg=>{const s=pg.items.find(i=>i.k==="sec");let t=s?s.t:"Pagina "+(pg.i+1);t=t.charAt(0)+t.slice(1).toLowerCase();return t.length>34?t.slice(0,32)+"…":t};
function renderAll(){runCalc();
  $("#nav").innerHTML=SPEC.pages.map((pg,i)=>`<button class="${i===tab?"on":""}${pageCover(pg.i)?" dim":""}" onclick="go(${i})">${esc(pageTitle(pg))}</button>`).join("");
  $("#main").innerHTML=(tab===0&&IMPORT_HINT?`<div class="imp">${IMPORT_HINT}</div>`:"")+pageH(SPEC.pages[tab])+`<div class="navb">${tab?`<button class="btn" onclick="go(${tab-1})">← Indietro</button>`:"<span></span>"}${tab<SPEC.pages.length-1?`<button class="btn pri" onclick="go(${tab+1})">Avanti →</button>`:`<button class="btn pri" onclick="doPDF()">Genera PDF</button>`}</div>`;
  initSig()}
function soft(){runCalc();
  document.querySelectorAll("[data-n]").forEach(e=>{const n=e.dataset.n;if(e===document.activeElement)return;if(e.type==="checkbox")e.checked=!!(S[n]&&S[n]!=="Off");else if((S[n]??"")!==e.value&&e.tagName!=="SELECT")e.value=S[n]??""});
  document.querySelectorAll("[data-c]").forEach(e=>{e.value=val(e.dataset.c);e.className=e.className.replace(/\b(ok|warn|ko)\b/g,"").trim()+" "+cls(e.dataset.c)})}
function go(i){tab=i;renderAll();window.scrollTo(0,0)}
function rerender(){const y=window.scrollY;setTimeout(()=>{const a=document.activeElement,an=a&&a.dataset&&a.dataset.n;renderAll();window.scrollTo(0,y);if(an){const e=document.querySelector(`[data-n="${an}"]`);if(e)e.focus({preventScroll:true})}},0)}
const NOUP=e=>e.type==="email"||e.type==="date"||e.type==="time";
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.n||t.type==="checkbox"||t.tagName==="SELECT")return;
  if(!NOUP(t)&&t.value!==t.value.toUpperCase()){const p=t.selectionStart;t.value=t.value.toUpperCase();try{t.setSelectionRange(p,p)}catch(x){}}
  S[t.dataset.n]=t.value;save();soft()});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.r){S[t.dataset.r]=t.value;save();rerender();return}
  if(!t.dataset.n)return;const n=t.dataset.n;
  if(t.type==="checkbox")S[n]=t.checked?(CHK[n]||"Yes"):"Off";else S[n]=t.value;save();
  if(t.tagName==="SELECT"||t.type==="checkbox")rerender();else{soft();rerender()}});
document.addEventListener("click",e=>{const sv=e.target.closest("[data-sv]");if(sv){const n=sv.dataset.sv;S[n]=S[n]===sv.dataset.v?"":sv.dataset.v;save();rerender();return}
  const b=e.target.closest("[data-tri]");if(!b)return;const N=b.dataset.tri.split(","),i=+b.dataset.i,was=S[N[i]]&&S[N[i]]!=="Off";
  N.forEach((n,k)=>S[n]=k===i&&!was?(CHK[n]||"Yes"):"Off");save();rerender()});
// ---------- firme
function initSig(){document.querySelectorAll("canvas.sig").forEach(cv=>{const k=cv.dataset.sig,ctx=cv.getContext("2d"),R=2;cv.width=cv.clientWidth*R;cv.height=cv.clientHeight*R;
  const pen=()=>{ctx.lineWidth=2.6*R;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0b2a6b"};pen();
  if(sig[k]){const im=new Image();im.onload=()=>{ctx.drawImage(im,0,0,cv.width,cv.height);pen()};im.src=sig[k]}
  let dr=false,last=null;const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*R,(e.clientY-r.top)*R]};
  cv.onpointerdown=e=>{e.preventDefault();dr=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}last=pt(e);ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7);ctx.fillStyle="#0b2a6b";ctx.fill()};
  cv.onpointermove=e=>{if(!dr)return;e.preventDefault();const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p};
  const end=()=>{if(!dr)return;dr=false;sig[k]=cv.toDataURL("image/png");save()};cv.onpointerup=end;cv.onpointercancel=end;cv.onpointerleave=end})}
function clearSig(k){delete sig[k];save();const cv=document.querySelector(`canvas[data-sig="${k}"]`);if(cv)cv.getContext("2d").clearRect(0,0,cv.width,cv.height)}
let rsz;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(initSig,250)});
// ---------- salvataggio, import / export
let tm;function save(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({S,sig}));PR.push(S,KEYP)}catch(e){}},300)}
function load(){try{const t=JSON.parse(localStorage.getItem(KEY)||"null");if(t){S=t.S||{};sig=t.sig||{}}}catch(e){}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
const base=()=>SPEC.code.replace(/\W+/g,"_")+"_"+String(S[Object.keys(S).find(k=>/cliente|ute_nome|cli_nome/.test(k))]||"modulo").replace(/[^\w-]+/g,"_");
function saveJSON(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({modulo:SPEC.code,S,sig})],{type:"application/json"}));a.download=base()+".json";a.click()}
function importFile(inp){const f=inp.files[0];if(!f)return;inp.value="";
  if(/\.pdf$/i.test(f.name)||f.type==="application/pdf")return importPDF(f);
  const r=new FileReader();r.onload=()=>{try{const t=JSON.parse(r.result);S=t.S||{};sig=t.sig||{};save();renderAll();toast("Dati importati")}catch(e){alert("File non valido")}};r.readAsText(f)}
// legge un PDF compilato (es. check list ricevuta dall'installatore) e ne copia i valori nel modulo
function loadPdfLib(){return window.PDFLib?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement("script");s.src="lib/pdf-lib.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function importPDF(file){try{await loadPdfLib();const pdf=await PDFLib.PDFDocument.load(await file.arrayBuffer(),{ignoreEncryption:true});const form=pdf.getForm();let n=0;
  form.getFields().forEach(fl=>{const name=fl.getName(),L=PDFLib;let v;
    try{if(fl instanceof L.PDFTextField)v=fl.getText()||"";else if(fl instanceof L.PDFDropdown||fl instanceof L.PDFOptionList)v=(fl.getSelected()||[])[0]||"";else if(fl instanceof L.PDFCheckBox)v=fl.isChecked()?(CHK[name]||"Yes"):"Off";else if(fl instanceof L.PDFRadioGroup)v=fl.getSelected()||"";else return}catch(e){return}
    if(!(name in FD)&&!(name in CHK))return;if(CALCF.has(name))return;if(DATES.has(name))v=it2iso(v);if(v&&FD[name]&&FD[name].t!=="chk"&&FD[name].t!=="sig")v=v.toUpperCase();
    if(FD[name]&&FD[name].t==="sig")return;if(v!==""&&v!=="Off"||S[name]){S[name]=v;n++}});
  save();renderAll();toast(n+" campi importati dal PDF: controllare e completare in cantiere")}catch(e){console.error(e);alert("Impossibile leggere il PDF: "+e.message)}}
// ---------- PDF
function doPDF(){runCalc();let h=`<h1>${esc(SPEC.title)}</h1>`;
  const fv=f=>{if(f.t==="chk")return S[f.n]&&S[f.n]!=="Off"?"SI":"";if(f.t==="sig")return"";const v=String(val(f.n)??"");return DATES.has(f.n)?iso2it(v):v};
  SPEC.pages.forEach(pg=>{if(pageCover(pg.i))return;let sec="",rows=[],pend=[];
    const out=()=>{if(!rows.length&&!pend.length)return;h+=`<h2>${esc(sec||SPEC.title)}</h2>`;if(rows.length){let t="<table>";for(let i=0;i<rows.length;i+=2)t+=`<tr><td>${esc(rows[i][0])}</td><td>${esc(rows[i][1])}</td><td>${esc(rows[i+1]?rows[i+1][0]:"")}</td><td>${esc(rows[i+1]?rows[i+1][1]:"")}</td></tr>`;h+=t+"</table>"}h+=pend.join("");rows=[];pend=[]};
    pg.items.forEach(it=>{if(it.k==="sec"){out();sec=it.t;return}
      if(it.k==="row")it.f.forEach(f=>{if(hid(f))return;if(f.t==="sig"){if(sig[f.n])pend.push(`<table><tr><th>${esc(f.l||"Firma")}</th></tr><tr><td><img src="${sig[f.n]}"></td></tr></table>`);return}const v=fv(f);if(v)rows.push([(f.l||f.n)+(f.u?" ("+f.u+")":""),v])});
      if(it.k==="tri"){const i=it.names.findIndex(n=>S[n]&&S[n]!=="Off");if(i>=0)rows.push([it.l,it.o[i]==="NV"||it.o[i]==="NA"?"N.A.":it.o[i]])}
      if(it.k==="tab"){const R=it.rows.filter(r=>r.f.some(f=>!hid(f)&&fv(f)));if(R.length){out();pend.push(`<table><tr><th></th>${it.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${R.map(r=>`<tr><td>${esc(r.l)}</td>${r.f.map(f=>`<td>${esc(hid(f)?"":fv(f))}</td>`).join("")}</tr>`).join("")}</table>`)}}});
    out()});
  let box=$("#pdfsrc");if(!box){box=document.createElement("div");box.id="pdfsrc";box.style.display="none";document.body.appendChild(box)}box.innerHTML=h;
  PDFK.share(box,{title:SPEC.title,code:SPEC.code,name:base()})}
load();PR.pull(S,KEYP);renderAll();
</script>
</body>
