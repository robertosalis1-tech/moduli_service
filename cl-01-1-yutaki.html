 "base": "q11", "o": ["SI", "NO", "NA"], "names": ["q11_SI", "q11_NO", "q11_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 356, 490, 367], "l": "Dove richiesto dal tipo di impianto (es. valvole termostatiche o di zona), è installato un by-pass differenziale o un volano termico che garantisca la portata minima? IMPORTANTE"}, {"k": "tri", "base": "q12", "o": ["SI", "NO", "NA"], "names": ["q12_SI", "q12_NO", "q12_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 383, 490, 394], "l": "Il contenuto d'acqua dell'impianto è pari o superiore al minimo indicato nel manuale di installazione per la configurazione realizzata? IMPORTANTE"}, {"k": "tri", "base": "q13", "o": ["SI", "NO", "NA"], "names": ["q13_SI", "q13_NO", "q13_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 410, 490, 421], "l": "Con circuito secondario, caldaia di integrazione o circuiti a portate diverse, è presente un separatore idraulico (compensatore di portata)?"}, {"k": "txt", "t": "Unità con produzione ACS (S Combi, H Combi, bollitori esterni):"}, {"k": "tri", "base": "q14", "o": ["SI", "NO", "NA"], "names": ["q14_SI", "q14_NO", "q14_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 449, 490, 460], "l": "È installato un vaso d'espansione sanitario con membrana atossica, idoneo per acqua potabile (UNI EN 13831)?"}, {"k": "tri", "base": "q15", "o": ["SI", "NO", "NA"], "names": ["q15_SI", "q15_NO", "q15_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 466, 490, 477], "l": "È installato un miscelatore termostatico che limiti la temperatura dell'ACS distribuita all'utenza?"}, {"k": "tri", "base": "q16", "o": ["SI", "NO", "NA"], "names": ["q16_SI", "q16_NO", "q16_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 488, 490, 499], "l": "È installata una valvola di sicurezza sul circuito sanitario con scarico convogliato e visibile (UNI EN 12897 / serie UNI EN 806)?"}, {"k": "tri", "base": "q17", "o": ["SI", "NO", "NA"], "names": ["q17_SI", "q17_NO", "q17_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 515, 490, 526], "l": "Il programma antilegionella è stato previsto secondo le Linee guida nazionali per la prevenzione della legionellosi (Conferenza Stato-Regioni 7/5/2015)?"}, {"k": "sec", "t": "2 - COMBINAZIONE CON CALDAIA"}, {"k": "tip", "t": "Se non è presente una caldaia di integrazione rispondere N.A. a tutta la sezione."}, {"k": "txt", "t": "Verifica N.A."}, {"k": "tri", "base": "q18", "o": ["SI", "NO", "NA"], "names": ["q18_SI", "q18_NO", "q18_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 599, 490, 610], "l": "È presente una caldaia di integrazione?"}, {"k": "row", "f": [{"n": "caldaia_logica", "r": [250, 615, 510, 629], "p": 1, "t": "sel", "o": ["", "Bivalente alternato - generatore in serie", "Bivalente alternato - generatore in parallelo", "Altro (specificare nelle note)"], "l": "Logica di funzionamento bivalente prevista"}]}, {"k": "tri", "base": "q20", "o": ["SI", "NO", "NA"], "names": ["q20_SI", "q20_NO", "q20_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 635, 490, 646], "l": "Nella logica in parallelo, è installata la sonda di temperatura nel serbatoio inerziale?"}, {"k": "tri", "base": "q21", "o": ["SI", "NO", "NA"], "names": ["q21_SI", "q21_NO", "q21_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 652, 490, 663], "l": "Il punto bivalente è stato definito secondo le indicazioni del progetto?"}, {"k": "tri", "base": "q22", "o": ["SI", "NO", "NA"], "names": ["q22_SI", "q22_NO", "q22_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 669, 490, 680], "l": "È stato eseguito il collegamento elettrico tra morsettiera Yutaki e caldaia? (contatto 37/38 pulito, privo di tensione)"}, {"k": "tri", "base": "q23", "o": ["SI", "NO", "NA"], "names": ["q23_SI", "q23_NO", "q23_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 686, 490, 697], "l": "La caldaia integra anche la produzione di ACS?"}, {"k": "tri", "base": "q24", "o": ["SI", "NO", "NA"], "names": ["q24_SI", "q24_NO", "q24_NA"], "on": ["Yes", "Yes", "Yes"], "p": 1, "r": [479, 703, 490, 714], "l": "Lo schema di collegamento della caldaia è stato fornito/validato da Hitachi ed è stato rispettato?"}]}, {"i": 2, "items": [{"k": "sec", "t": "3 - CIRCUITO SOLARE TERMICO"}, {"k": "tip", "t": "Compilare solo con solare termico a circolazione forzata; con circolazione naturale o senza solare rispondere N.A."}, {"k": "txt", "t": "Verifica N.A."}, {"k": "tri", "base": "q25", "o": ["SI", "NO", "NA"], "names": ["q25_SI", "q25_NO", "q25_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 145, 490, 156], "l": "Il gruppo di circolazione è installato secondo le specifiche del costruttore dei collettori solari?"}, {"k": "tri", "base": "q26", "o": ["SI", "NO", "NA"], "names": ["q26_SI", "q26_NO", "q26_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 162, 490, 173], "l": "È installato un vaso d'espansione con membrana idonea alle alte temperature?"}, {"k": "tri", "base": "q27", "o": ["SI", "NO", "NA"], "names": ["q27_SI", "q27_NO", "q27_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 179, 490, 190], "l": "È installata una valvola di sicurezza con scarico convogliato, idonea al circuito solare?"}, {"k": "tri", "base": "q28", "o": ["SI", "NO", "NA"], "names": ["q28_SI", "q28_NO", "q28_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 196, 490, 207], "l": "È installato il regolatore di portata?"}, {"k": "tri", "base": "q29", "o": ["SI", "NO", "NA"], "names": ["q29_SI", "q29_NO", "q29_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 213, 490, 224], "l": "Tubazioni, isolamenti e guarnizioni sono idonei alle alte temperature?"}, {"k": "tri", "base": "q30", "o": ["SI", "NO", "NA"], "names": ["q30_SI", "q30_NO", "q30_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 230, 490, 241], "l": "Sul campo collettori è installato uno sfiato aria automatico idoneo alle alte temperature?"}, {"k": "tri", "base": "q31", "o": ["SI", "NO", "NA"], "names": ["q31_SI", "q31_NO", "q31_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 247, 490, 258], "l": "È installato un disaeratore automatico di microbolle idoneo alle alte temperature?"}, {"k": "tri", "base": "q32", "o": ["SI", "NO", "NA"], "names": ["q32_SI", "q32_NO", "q32_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 264, 490, 275], "l": "Il circuito solare è gestito da una centralina NON Hitachi? (se SI indicarne marca e modello nelle osservazioni)"}, {"k": "tri", "base": "q33", "o": ["SI", "NO", "NA"], "names": ["q33_SI", "q33_NO", "q33_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 281, 490, 292], "l": "È installata la sonda di temperatura sul collettore solare?"}, {"k": "tri", "base": "q34", "o": ["SI", "NO", "NA"], "names": ["q34_SI", "q34_NO", "q34_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 298, 490, 309], "l": "È installata la sonda di temperatura sul bollitore ACS?"}, {"k": "tri", "base": "q35", "o": ["SI", "NO", "NA"], "names": ["q35_SI", "q35_NO", "q35_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 315, 490, 326], "l": "La portata del circuito è conforme alle specifiche del costruttore dei collettori?"}, {"k": "tri", "base": "q36", "o": ["SI", "NO", "NA"], "names": ["q36_SI", "q36_NO", "q36_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 332, 490, 343], "l": "La superficie di scambio del bollitore è adeguata alla potenza del campo solare?"}, {"k": "tri", "base": "q37", "o": ["SI", "NO", "NA"], "names": ["q37_SI", "q37_NO", "q37_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 349, 490, 360], "l": "Il riempimento del circuito solare è stato eseguito con pompa di carico?"}, {"k": "tri", "base": "q38", "o": ["SI", "NO", "NA"], "names": ["q38_SI", "q38_NO", "q38_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 366, 490, 377], "l": "Il circuito è caricato con fluido antigelo nella concentrazione indicata dal costruttore dei collettori?"}, {"k": "sec", "t": "4 - PARTE ELETTRICA"}, {"k": "txt", "t": "Verifica N.A."}, {"k": "tri", "base": "q39", "o": ["SI", "NO", "NA"], "names": ["q39_SI", "q39_NO", "q39_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 431, 490, 442], "l": "I cavi di alimentazione hanno sezione adeguata secondo il manuale di installazione? IMPORTANTE"}, {"k": "tri", "base": "q40", "o": ["SI", "NO", "NA"], "names": ["q40_SI", "q40_NO", "q40_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 453, 490, 464], "l": "Sono installati interruttore magnetotermico, interruttore differenziale e sezionatore dedicati per l'unità esterna e per l'unità interna? IMPORTANTE"}, {"k": "tri", "base": "q41", "o": ["SI", "NO", "NA"], "names": ["q41_SI", "q41_NO", "q41_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 480, 490, 491], "l": "Il cavo di comunicazione H-Link è schermato, a 2 poli (preferibilmente twistato), di sezione minima 2 x 0,75 mm2 e posato separato dai cavi di potenza?"}, {"k": "tri", "base": "q42", "o": ["SI", "NO", "NA"], "names": ["q42_SI", "q42_NO", "q42_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 507, 490, 518], "l": "La schermatura del cavo H-Link è collegata a terra in un solo punto (lato unità esterna) e isolata alle altre estremità?"}, {"k": "tri", "base": "q43", "o": ["SI", "NO", "NA"], "names": ["q43_SI", "q43_NO", "q43_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 534, 490, 545], "l": "È collegato ai morsetti 13-14 un termostato ambiente o un consenso di marcia della pompa di calore (oppure è presente il ponticello)?"}, {"k": "tri", "base": "q44", "o": ["SI", "NO", "NA"], "names": ["q44_SI", "q44_NO", "q44_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 556, 490, 567], "l": "Con termostato ambiente wireless, il ricevitore radio è collegato ai morsetti 1-2?"}, {"k": "tri", "base": "q45", "o": ["SI", "NO", "NA"], "names": ["q45_SI", "q45_NO", "q45_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 578, 490, 589], "l": "L'unità esterna è alimentata prima dell'avviamento da almeno 24 ore (Yutaki) o 12 ore (airH2O 800), con riscaldatore del carter compressore attivo? IMPORTANTE"}, {"k": "tri", "base": "q46", "o": ["SI", "NO", "NA"], "names": ["q46_SI", "q46_NO", "q46_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 605, 490, 616], "l": "Solo Yutaki S / S Combi 4-10 HP: per evitare avviamenti accidentali è stato impostato DSW1 pin 4 = ON sull'unità esterna?"}, {"k": "tri", "base": "q47", "o": ["SI", "NO", "NA"], "names": ["q47_SI", "q47_NO", "q47_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 632, 490, 643], "l": "Solo Yutaki S / S Combi 2-3 HP: per evitare avviamenti accidentali è stato impostato DSW301 pin 4 = ON sull'unità esterna?"}, {"k": "tri", "base": "q48", "o": ["SI", "NO", "NA"], "names": ["q48_SI", "q48_NO", "q48_NA"], "on": ["Yes", "Yes", "Yes"], "p": 2, "r": [479, 654, 490, 665], "l": "I dispositivi di comando e controllo (termostati, comandi, contatti esterni) sono stati collegati e provati?"}]}, {"i": 3, "items": [{"k": "sec", "t": "5 - IMPIANTO FRIGORIFERO (UNITÀ SPLIT R32 / R410A)"}, {"k": "tip", "t": "Sezione da compilare per le unità split con linee frigorifere realizzate in opera. Per i monoblocchi (Yutaki M, airH2O 800) rispondere N.A. e compilare, per l'R290, la sezione 6."}, {"k": "txt", "t": "Verifica N.A."}, {"k": "tri", "base": "q49", "o": ["SI", "NO", "NA"], "names": ["q49_SI", "q49_NO", "q49_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 155, 490, 166], "l": "Le tubazioni frigorifere hanno i diametri indicati nel manuale e sono isolate su entrambe le linee?"}, {"k": "tri", "base": "q50", "o": ["SI", "NO", "NA"], "names": ["q50_SI", "q50_NO", "q50_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 177, 490, 188], "l": "Eventuali tubazioni posate in predisposizione sono state lavate con azoto secco prima del collegamento? IMPORTANTE"}, {"k": "tri", "base": "q51", "o": ["SI", "NO", "NA"], "names": ["q51_SI", "q51_NO", "q51_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 204, 490, 215], "l": "È stata eseguita la prova di tenuta con azoto alla pressione prescritta dal manuale (max 32-35 bar) con esito positivo dopo 72 ore? IMPORTANTE"}, {"k": "txt", "t": "È stato eseguito il vuoto fino a un valore pari o inferiore a 500 micron (mTorr), misurato con vacuometro digitale?"}, {"k": "tri", "base": "q52", "o": ["SI", "NO", "NA"], "names": ["q52_SI", "q52_NO", "q52_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 236, 490, 247], "l": "rubinetti dell'unità esterna devono restare chiusi fino alla verifica del vuoto da parte del SAT: in caso contrario il collaudo non può essere eseguito e la garanzia può decadere. IMPORTANTE"}, {"k": "tri", "base": "q53", "o": ["SI", "NO", "NA"], "names": ["q53_SI", "q53_NO", "q53_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 263, 490, 274], "l": "Unità R32: la lunghezza della linea frigorifera è di almeno 3 m? IMPORTANTE"}, {"k": "tri", "base": "q54", "o": ["SI", "NO", "NA"], "names": ["q54_SI", "q54_NO", "q54_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 280, 490, 291], "l": "Unità R410A: la lunghezza della linea frigorifera è di almeno 5 m? IMPORTANTE"}, {"k": "tri", "base": "q55", "o": ["SI", "NO", "NA"], "names": ["q55_SI", "q55_NO", "q55_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 302, 490, 313], "l": "Le unità interna ed esterna sono facilmente accessibili per assistenza e manutenzione (spazi di servizio del manuale rispettati)?"}, {"k": "tri", "base": "q56", "o": ["SI", "NO", "NA"], "names": ["q56_SI", "q56_NO", "q56_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 329, 490, 340], "l": "La lunghezza della linea frigorifera è entro il massimo del catalogo tecnico (50 m per 2/2,5/3 HP - 75 m per 4/5/6 HP - 70 m per 8/10 HP)?"}, {"k": "tri", "base": "q57", "o": ["SI", "NO", "NA"], "names": ["q57_SI", "q57_NO", "q57_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 356, 490, 367], "l": "L'unità esterna è posizionata secondo il manuale di installazione Hitachi (spazi liberi, basamento, scarico condensa)?"}, {"k": "tri", "base": "q58", "o": ["SI", "NO", "NA"], "names": ["q58_SI", "q58_NO", "q58_NA"], "on": ["Yes", "Yes", "Yes"], "p": 3, "r": [479, 383, 490, 394], "l": "Solo Yutaki S80: per l'esecuzione del vuoto è stato impostato DSW4 pin 2 = ON sull'unità interna (apertura valvole)?"}, {"k": "row", "f": [{"n": "liq_m", "r": [230, 410, 300, 424], "p": 3, "t": "tx", "l": "Lunghezza e diametro linea liquido", "u": "m"}, {"n": "liq_d", "r": [427, 410, 517, 424], "p": 3, "t": "tx", "l": "Diametro"}]}, {"k": "row", "f": [{"n": "gas_m", "r": [230, 429, 300, 443], "p": 3, "t": "tx", "l": "Lunghezza e diametro linea gas", "u": "m"}, {"n": "gas_d", "r": [427, 429, 517, 443], "p": 3, "t": "tx", "l": "Diametro"}]}, {"k": "row", "f": [{"n": "gas_add", "r": [230, 448, 300, 465], "p": 3, "t": "tx", "l": "Carica aggiuntiva di refrigerante (fornita 61 dall'installatore)", "u": "kg"}]}, {"k": "txt", "t": "Carica aggiuntiva: 30 g/m per linee oltre 10 m (Yutaki S e S Combi 2/2,5/3 HP) - 65 g/m per linee oltre 15 m (Yutaki S e S Combi 4/5/6/8/10 HP)."}, {"k": "row", "f": [{"n": "gas_tot", "r": [230, 482, 300, 499], "p": 3, "t": "tx", "l": "Carica totale di refrigerante nel circuito 62 (carica di fabbrica + aggiuntiva)", "u": "kg"}]}]}, {"i": 4, "items": [{"k": "txt", "t": "5.1 - Idoneità del locale per unità interne R32 (refrigerante A2L)"}, {"k": "txt", "t": "L'R32 è un refrigerante infiammabile con bassa velocità di combustione ( classe A2L , ISO 817). Procedura dei manuali Hitachi (TCIT0150 / TCIT0153 par. 8.2.1 e 8.5.2, Manuale di sicurezza R32 secondo IEC 60335-2-40:2022): carica totale inferiore a 1,84 kg : nessun requisito di superficie minima. Carica pari o superiore a 1,84 kg : la superficie del locale (stanza A) deve essere almeno pari ad Amin , ricavata dalla tabella in base alla carica (mc) e all'altezza di installazione (h0). Se la stanza A è più piccola, si può considerare una stanza adiacente B: la superficie A + B deve superare Amin totale ed è necessaria la ventilazione naturale tra le stanze con apertura minima Anv,min Se nessuna opzione è possibile: scegliere un'altra configurazione (ridurre la lunghezza delle tubazioni e quindi la carica, sistema monoblocco, ecc.) o contattare Hitachi."}, {"k": "row", "f": [{"n": "r32_locale", "r": [297, 175, 550, 189], "p": 4, "t": "tx", "l": "Locale di installazione dell'unità interna Destinazione d'uso 63 (stanza A)"}]}, {"k": "row", "f": [{"n": "r32_inst", "r": [230, 194, 360, 208], "p": 4, "t": "sel", "o": ["", "A pavimento", "A parete", "Altro (vedi manuale)"], "l": "Installazione unità interna"}, {"n": "r32_h0", "r": [483, 194, 533, 208], "p": 4, "t": "tx", "l": "Altezza di installazione h0", "u": "m"}]}, {"k": "row", "f": [{"n": "r32_area", "r": [230, 213, 290, 227], "p": 4, "t": "tx", "l": "Superficie della stanza A", "u": "m2"}, {"n": "r32_amin", "r": [448, 213, 509, 227], "p": 4, "t": "tx", "l": "Amin da tabella", "u": "m2"}]}, {"k": "row", "f": [{"n": "r32_areab", "r": [267, 232, 313, 246], "p": 4, "t": "tx", "l": "Stanza B adiacente (se necessaria) Superficie", "u": "m2"}, {"n": "r32_anv", "r": [399, 232, 422, 246], "p": 4, "t": "tx", "l": "Anv,min richiesta", "u": "dm2"}, {"n": "r32_ab", "r": [502, 232, 530, 246], "p": 4, "t": "tx", "l": "Apertura bassa", "u": "dm2"}]}, {"k": "txt", "t": "Verifica R32 N.A."}, {"k": "tri", "base": "q67", "o": ["SI", "NO", "NA"], "names": ["q67_SI", "q67_NO", "q67_NA"], "on": ["Yes", "Yes", "Yes"], "p": 4, "r": [479, 272, 490, 283], "l": "La carica totale di R32 è inferiore a 1,84 kg? (se SI non ci sono requisiti di superficie minima: rispondere N.A. alle voci da qui fino alla tabella)"}, {"k": "tri", "base": "q68", "o": ["SI", "NO", "NA"], "names": ["q68_SI", "q68_NO", "q68_NA"], "on": ["Yes", "Yes", "Yes"], "p": 4, "r": [479, 294, 490, 305], "l": "Con carica pari o superiore a 1,84 kg: la superficie della stanza A è pari o superiore ad Amin? IMPORTANTE"}, {"k": "tri", "base": "q69", "o": ["SI", "NO", "NA"], "names": ["q69_SI", "q69_NO", "q69_NA"], "on": ["Yes", "Yes", "Yes"], "p": 4, "r": [479, 311, 490, 322], "l": "Stanza A sottodimensionata: la superficie A + B supera Amin totale?"}, {"k": "txt", "t": "Almeno metà di Anv,min è realizzata con aperture basse, entro 200 mm dal pavimento, con base non oltre 100"}, {"k": "tri", "base": "q70", "o": ["SI", "NO", "NA"], "names": ["q70_SI", "q70_NO", "q70_NA"], "on": ["Yes", "Yes", "Yes"], "p": 4, "r": [479, 338, 490, 349], "l": "mm dal pavimento e non più alta del punto di possibile rilascio del refrigerante? (le aperture oltre 300 mm dal pavimento non contano per Anv,min)"}, {"k": "tri", "base": "q71", "o": ["SI", "NO", "NA"], "names": ["q71_SI", "q71_NO", "q71_NA"], "on": ["Yes", "Yes", "Yes"], "p": 4, "r": [479, 370, 490, 381], "l": "È presente una seconda apertura alta, pari ad almeno il 50% di Anv,min, posizionata ad almeno 1,5 m dal pavimento?"}, {"k": "tri", "base": "q72", "o": ["SI", "NO", "NA"], "names": ["q72_SI", "q72_NO", "q72_NA"], "on": ["Yes", "Yes", "Yes"], "p": 4, "r": [479, 397, 490, 408], "l": "Le aperture sono permanenti e non sigillabili, e le aperture tra le stanze hanno un'altezza di almeno 20 mm tra parete e pavimento?"}, {"k": "tri", "base": "q73", "o": ["SI", "NO", "NA"], "names": ["q73_SI", "q73_NO", "q73_NA"], "on": ["Yes", "Yes", "Yes"], "p": 4, "r": [479, 424, 490, 435], "l": "Il locale non contiene fonti di innesco permanenti in funzione (fiamme libere, apparecchi a gas, stufe elettriche a resistenza esposta)?"}, {"k": "tri", "base": "q74", "o": ["SI", "NO", "NA"], "names": ["q74_SI", "q74_NO", "q74_NA"], "on": ["Yes", "Yes", "Yes"], "p": 4, "r": [479, 451, 490, 462], "l": "La ditta installatrice e il tecnico frigorista sono certificati F-gas e l'installazione sarà comunicata alla Banca Dati F-gas entro 30 giorni (Reg. UE 2024/573, D.P.R. 146/2018)?"}, {"k": "txt", "t": "Tabella superficie minima Amin (m2) - airH2O 600S / 600S Combi (TCIT0153 par. 8.5.2)"}, {"k": "txt", "t": "mc (kg) \\ h0 (m) 1,2 1,3 1,4 1,5 1,6 1,7 1,8 1,9 1,84 7,20 6,15 5,71 5,33 4,99 4,70 4,44 4,21 2,0 8,51 7,25 6,25 5,79 5,43 5,11 4,82 4,57 2,2 10,30 8,77 7,57 6,59 5,97 5,62 5,31 5,03 2,4 12,26 10,44 9,00 7,84 6,89 6,13 5,79 5,48 2,6 14,38 12,26 10,57 9,21 8,09 7,17 6,39 5,94 2,8 16,68 14,21 12,26 10,68 9,38 8,31 7,41 6,65 3,0 19,15 16,32 14,07 12,26 10,77 9,54 8,51 7,64 3,2 21,79 18,56 16,01 13,94 12,26 10,86 9,68 8,69 3,4 24,60 20,96 18,07 15,74 13,84 12,26 10,93 9,81 3,6 27,58 23,50 20,26 17,65 15,51 13,74 12,26 11,00 3,8 30,72 26,18 22,57 19,66 17,28 15,31 13,66 12,26 4,0 34,04 29,01 25,01 21,79 19,15 16,96 15,13 13,58 4,2 37,53 31,98 27,58 24,02 21,11 18,70 16,68 14,97 4,4 41,19 35,10 30,26 26,36 23,17 20,52 18,31 16,43 4,5 43,09 36,71 31,66 27,58 24,24 21,47 19,15 17,19 4,6 45,02 38,36 33,08 28,81 25,33 22,43 20,01 17,96"}, {"k": "tip", "t": "600S Combi: utilizzare le colonne h0 = 1,7 / 1,8 / 1,9 m. Per valori intermedi scegliere la carica più alta e l'altezza più bassa. Per gli altri modelli Yutaki R32 utilizzare la tabella del Manuale di sicurezza R32 fornito con l'unità."}, {"k": "txt", "t": "Se la superficie del locale non è sufficiente e non sono adottate le misure previste dal manuale, l'impianto non è installabile in quel locale e il SAT non esegue il primo avviamento (si applica la clausola di addebito)."}]}, {"i": 6, "items": [{"k": "txt", "t": "R290 - REFRIGERANTE ESTREMAMENTE INFIAMMABILE (A3)"}, {"k": "sec", "t": "!"}, {"k": "txt", "t": "L'unità esterna airH2O 800 contiene R290, gas estremamente infiammabile (gruppo di sicurezza A3 secondo ISO 817) con densità superiore all'aria : in caso di fuga il refrigerante può accumularsi vicino al suolo. Intorno all'unità va quindi definita e mantenuta una zona di protezione (manuale di installazione PMML0670, par. 6.4)."}, {"k": "txt", "t": "Nella zona di protezione non devono essere presenti aperture, finestre, porte, ingressi di scantinati, fognature o simili , né, in modo permanente o temporaneo, fonti di innesco : fiamme libere, impianti elettrici, prese, lampade, interruttori, collegamenti elettrici, utensili che producono scintille, oggetti con temperatura superficiale di 360 °C o superiore. La zona non deve estendersi su edifici adiacenti o aree di traffico pubblico (confini dei vicini, strade e sentieri pubblici o privati)."}, {"k": "row", "f": [{"n": "r290_mod", "r": [210, 222, 340, 246], "p": 6, "t": "sel", "o": ["", "RASM-2VTW2E", "RASM-3VTW2E", "RASM-3.5VTW2E", "RASM-4VTW2E", "RASM-5VTW2E", "RASM-6VTW2E", "RASM-4TW2E", "RASM-5TW2E", "RASM-6TW2E"], "l": "75 (carica di fabbrica: 0,9 kg 2-3,5 HP; 1,2"}, {"n": "r290_carica", "r": [428, 222, 479, 246], "p": 6, "t": "tx", "l": "Carica R290", "u": "kg"}]}, {"k": "txt", "t": "Modello unità esterna airH2O 800"}, {"k": "txt", "t": "kg 4-6 HP)"}, {"k": "row", "f": [{"n": "r290_conf", "r": [210, 252, 440, 268], "p": 6, "t": "sel", "o": ["", "A terra / tetto piano - area aperta (A)", "Di fronte a una parete (A, B, C, D)", "In un angolo dell'edificio (B-H)", "Tra 3 pareti (B, D, H, I, J)"], "l": "Configurazione di installazione (schemi 76 par. 6.4)"}]}, {"k": "txt", "t": "Quote misurate (mm) - compilare quelle della configurazione scelta"}, {"k": "row", "f": [{"n": "r290_qA", "r": [259, 290, 305, 304], "p": 6, "t": "tx", "l": "A"}, {"n": "r290_qB", "r": [320, 290, 366, 304], "p": 6, "t": "tx", "l": "B"}, {"n": "r290_qC", "r": [381, 290, 427, 304], "p": 6, "t": "tx", "l": "C"}, {"n": "r290_qD", "r": [442, 290, 489, 304], "p": 6, "t": "tx", "l": "D"}, {"n": "r290_qE", "r": [503, 290, 550, 304], "p": 6, "t": "tx", "l": "E"}]}, {"k": "row", "f": [{"n": "r290_qF", "r": [258, 310, 305, 324], "p": 6, "t": "tx", "l": "F"}, {"n": "r290_qG", "r": [321, 310, 366, 324], "p": 6, "t": "tx", "l": "G"}, {"n": "r290_qH", "r": [381, 310, 427, 324], "p": 6, "t": "tx", "l": "H"}, {"n": "r290_qI", "r": [439, 310, 488, 324], "p": 6, "t": "tx", "l": "I"}, {"n": "r290_qJ", "r": [502, 310, 550, 324], "p": 6, "t": "tx", "l": "J"}]}, {"k": "txt", "t": "Quote minime (mm): A 1000 | B 300 | C 2000 | D 2500 (angolo, tra 3 pareti) oppure 3000 (di fronte a una parete) | E 1000 | F 500 | G 1800 | H 500 | I 500 | J 2300"}, {"k": "txt", "t": "Zona di protezione R290 - rispondere SI se l'elemento è ASSENTE dalla zona: N.A."}, {"k": "tri", "base": "q77", "o": ["SI", "NO", "NA"], "names": ["q77_SI", "q77_NO", "q77_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 373, 490, 384], "l": "Porte, finestre, porte-finestre, lucernari e altre aperture verso locali interni (anche serramenti apribili o a ribalta) IMPORTANTE"}, {"k": "tri", "base": "q78", "o": ["SI", "NO", "NA"], "names": ["q78_SI", "q78_NO", "q78_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 400, 490, 411], "l": "Bocche di lupo, griglie, intercapedini, ingressi di scantinati, garage o locali interrati e qualsiasi apertura verso locali a quota inferiore IMPORTANTE"}, {"k": "tri", "base": "q79", "o": ["SI", "NO", "NA"], "names": ["q79_SI", "q79_NO", "q79_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 427, 490, 438], "l": "Prese d'aria esterna: ventilazione meccanica (VMC), prese d'aria di caldaie, camini e canne fumarie, aspirazioni di cappe o aerazioni di locali IMPORTANTE"}, {"k": "tri", "base": "q80", "o": ["SI", "NO", "NA"], "names": ["q80_SI", "q80_NO", "q80_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 449, 490, 460], "l": "Fognature, scarichi, tombini, pozzetti, caditoie, griglie di drenaggio, fosse biologiche IMPORTANTE"}, {"k": "tri", "base": "q81", "o": ["SI", "NO", "NA"], "names": ["q81_SI", "q81_NO", "q81_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 471, 490, 482], "l": "Avvallamenti del terreno, fosse, scale verso piani interrati, cavedi o cortili chiusi in cui il gas può ristagnare IMPORTANTE"}, {"k": "tri", "base": "q82", "o": ["SI", "NO", "NA"], "names": ["q82_SI", "q82_NO", "q82_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 498, 490, 509], "l": "Fonti di innesco permanenti o temporanee: fiamme libere, impianti e collegamenti elettrici, prese, lampade, interruttori, utensili che producono scintille, superfici a 360 °C o più IMPORTANTE"}, {"k": "tri", "base": "q83", "o": ["SI", "NO", "NA"], "names": ["q83_SI", "q83_NO", "q83_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 525, 490, 536], "l": "Edifici adiacenti, proprietà dei vicini, strade o sentieri pubblici o privati (la zona non deve estendersi su di essi) IMPORTANTE"}, {"k": "txt", "t": "Installazione unità R290 N.A."}, {"k": "tri", "base": "q84", "o": ["SI", "NO", "NA"], "names": ["q84_SI", "q84_NO", "q84_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 567, 490, 578], "l": "L'unità è installata all'aperto, in luogo con buona ventilazione (non in nicchie chiuse, cavedi, locali tecnici, sottotetti o sotto coperture chiuse su più lati)? IMPORTANTE"}, {"k": "tri", "base": "q85", "o": ["SI", "NO", "NA"], "names": ["q85_SI", "q85_NO", "q85_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 589, 490, 600], "l": "L'unità è installata in un'area riservata, non accessibile al pubblico, ad altitudine inferiore a 2000 m?"}, {"k": "tri", "base": "q86", "o": ["SI", "NO", "NA"], "names": ["q86_SI", "q86_NO", "q86_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 611, 490, 622], "l": "L'unità poggia su una base livellata, consigliata 100-300 mm sopra il pavimento, fissata con perni di ancoraggio M10?"}, {"k": "tri", "base": "q87", "o": ["SI", "NO", "NA"], "names": ["q87_SI", "q87_NO", "q87_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 638, 490, 649], "l": "Gli spazi di servizio sono rispettati (PMML0670 par. 6.2) e, con più unità affiancate, tra le unità ci sono almeno 500 mm?"}, {"k": "tri", "base": "q88", "o": ["SI", "NO", "NA"], "names": ["q88_SI", "q88_NO", "q88_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 660, 490, 671], "l": "L'unità è ad almeno 3 m da fonti di onde elettromagnetiche (es. apparecchiature medicali)?"}, {"k": "tri", "base": "q89", "o": ["SI", "NO", "NA"], "names": ["q89_SI", "q89_NO", "q89_NA"], "on": ["Yes", "Yes", "Yes"], "p": 6, "r": [479, 682, 490, 693], "l": "Lo scarico della condensa è disperso nel terreno o convog   if(t.dataset.r){S[t.dataset.r]=t.value;save();rerender();return}
  if(!t.dataset.n)return;const n=t.dataset.n;
  if(t.type==="checkbox")S[n]=t.checked?(CHK[n]||"Yes"):"Off";else S[n]=t.value;save();
  if(t.tagName==="SELECT"||t.type==="checkbox")rerender();else{soft();rerender()}});
document.addEventListener("click",e=>{const sv=e.target.closest("[data-sv]");if(sv){const n=sv.dataset.sv;S[n]=S[n]===sv.dataset.v?"":sv.dataset.v;save();rerender();return}
  const b=e.target.closest("[data-tri]");if(!b)return;const N=b.dataset.tri.split(","),i=+b.dataset.i,was=S[N[i]]&&S[N[i]]!=="Off";
  N.forEach((n,k)=>S[n]=k===i&&!was?(CHK[n]||"Yes"):"Off");save();rerender()});
// ---------- firme
function initSig(){document.querySelectorAll("canvas.sig").forEach(cv=>{const k=cv.dataset.sig,ctx=cv.getContext("2d"),R=2;cv.width=cv.clientWidth*R;cv.height=cv.clientHeight*R;
  const pen=()=>{ctx.lineWidth=2.6*R;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0b2a6b"};pen();
  if(sig[k]){const im=new Image();im.onload=()=>{ctx.drawImage(im,0,0,cv.width,cv.height);pen()};im.src=sig[k]}
  let dr=false,last=null;const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*R,(e.clientY-r.top)*R]};
  cv.onpointerdown=e=>{e.preventDefault();dr=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}last=pt(e);ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7);ctx.fillStyle="#0b2a6b";ctx.fill()};
  cv.onpointermove=e=>{if(!dr)return;e.preventDefault();const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p};
  const end=()=>{if(!dr)return;dr=false;sig[k]=cv.toDataURL("image/png");save()};cv.onpointerup=end;cv.onpointercancel=end;cv.onpointerleave=end})}
function clearSig(k){delete sig[k];save();const cv=document.querySelector(`canvas[data-sig="${k}"]`);if(cv)cv.getContext("2d").clearRect(0,0,cv.width,cv.height)}
let rsz;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(initSig,250)});
// ---------- salvataggio, import / export
let tm;function save(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({S,sig}));PR.push(S,KEYP)}catch(e){}},300)}
function load(){try{const t=JSON.parse(localStorage.getItem(KEY)||"null");if(t){S=t.S||{};sig=t.sig||{}}}catch(e){}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
const base=()=>SPEC.code.replace(/\W+/g,"_")+"_"+String(S[Object.keys(S).find(k=>/cliente|ute_nome|cli_nome/.test(k))]||"modulo").replace(/[^\w-]+/g,"_");
function saveJSON(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({modulo:SPEC.code,S,sig})],{type:"application/json"}));a.download=base()+".json";a.click()}
function importFile(inp){const f=inp.files[0];if(!f)return;inp.value="";
  if(/\.pdf$/i.test(f.name)||f.type==="application/pdf")return importPDF(f);
  const r=new FileReader();r.onload=()=>{try{const t=JSON.parse(r.result);S=t.S||{};sig=t.sig||{};save();renderAll();toast("Dati importati")}catch(e){alert("File non valido")}};r.readAsText(f)}
// legge un PDF compilato (es. check list ricevuta dall'installatore) e ne copia i valori nel modulo
function loadPdfLib(){return window.PDFLib?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement("script");s.src="lib/pdf-lib.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function importPDF(file){try{await loadPdfLib();const pdf=await PDFLib.PDFDocument.load(await file.arrayBuffer(),{ignoreEncryption:true});const form=pdf.getForm();let n=0;
  form.getFields().forEach(fl=>{const name=fl.getName(),L=PDFLib;let v;
    try{if(fl instanceof L.PDFTextField)v=fl.getText()||"";else if(fl instanceof L.PDFDropdown||fl instanceof L.PDFOptionList)v=(fl.getSelected()||[])[0]||"";else if(fl instanceof L.PDFCheckBox)v=fl.isChecked()?(CHK[name]||"Yes"):"Off";else if(fl instanceof L.PDFRadioGroup)v=fl.getSelected()||"";else return}catch(e){return}
    if(!(name in FD)&&!(name in CHK))return;if(CALCF.has(name))return;if(DATES.has(name))v=it2iso(v);if(v&&FD[name]&&FD[name].t!=="chk"&&FD[name].t!=="sig")v=v.toUpperCase();
    if(FD[name]&&FD[name].t==="sig")return;if(v!==""&&v!=="Off"||S[name]){S[name]=v;n++}});
  save();renderAll();toast(n+" campi importati dal PDF: controllare e completare in cantiere")}catch(e){console.error(e);alert("Impossibile leggere il PDF: "+e.message)}}
// ---------- PDF
const TPLKEY="011";
function doPDF(only){if(EXT.pdf){if(only!=="cart"&&window.FOTO&&FOTO.check&&!FOTO.check())return Promise.resolve();const FO=window.FOTO;if(only==="cart")window.FOTO=null;return EXT.pdf(only).finally(()=>{window.FOTO=FO})}if(TPLKEY&&window.PDFFILL){runCalc();const cc=only==="cart";return PDFFILL.share({key:TPLKEY,values:Object.assign({},C,S),sig:sig,mode:cc?"cart":"full",title:SPEC.title,code:SPEC.code,cliente:S.cliente||S.v_cliente||S.ragione_sociale||"",name:base()+(cc?"_cartolina":"")})}runCalc();let h=`<h1>${esc(only==="cart"?"Cartolina garanzia":SPEC.title)}</h1>`;
  const fv=f=>{if(f.t==="chk")return S[f.n]&&S[f.n]!=="Off"?"SI":"";if(f.t==="sig")return"";const v=String(val(f.n)??"");return DATES.has(f.n)?iso2it(v):v};
  SPEC.pages.forEach(pg=>{if(pageCover(pg.i))return;if(only==="cart"&&!pg.cart)return;let sec="",rows=[],pend=[],skipS=false;
    const out=()=>{if(!rows.length&&!pend.length)return;h+=`<h2>${esc(sec||SPEC.title)}</h2>`;if(rows.length){let t="<table>";for(let i=0;i<rows.length;i+=2)t+=`<tr><td>${esc(rows[i][0])}</td><td>${esc(rows[i][1])}</td><td>${esc(rows[i+1]?rows[i+1][0]:"")}</td><td>${esc(rows[i+1]?rows[i+1][1]:"")}</td></tr>`;h+=t+"</table>"}h+=pend.join("");rows=[];pend=[]};
    pg.items.forEach(it=>{if(EXT.items&&EXT.items[it.k]){const x=EXT.items[it.k].pdf?EXT.items[it.k].pdf(it):"";if(x){out();pend.push(x)}return}if(it.k==="txt"&&it.pdf){pend.push(`<p>${esc(it.t)}</p>`);return}if(it.k==="sec"){out();sec=it.t;skipS=it.cp!=null&&!!pageCover(it.cp);return}if(skipS)return;
      if(it.k==="row")it.f.forEach(f=>{if(hid(f))return;if(f.t==="sig"){if(sig[f.n])pend.push(`<table><tr><th>${esc(f.l||"Firma")}</th></tr><tr><td><img src="${sig[f.n]}"></td></tr></table>`);return}const v=fv(f);if(v)rows.push([(f.l||f.n)+(f.u?" ("+f.u+")":""),v])});
      if(it.k==="sigb"){if(hid(it.sig))return;const nm=it.nome?val(it.nome.n):"",dt=it.data?iso2it(String(val(it.data.n)||"")):"";if(!nm&&!sig[it.sig.n])return;out();if(!sec)sec="Firme";pend.push(`<table><tr><th>Firma - ${esc(it.title)}${nm?": "+esc(nm):""}${dt?" - "+esc(dt):""}</th></tr><tr><td>${sig[it.sig.n]?`<img src="${sig[it.sig.n]}">`:""}</td></tr></table>`);out();return}
      if(it.k==="uil"){if(it.cp!=null&&pageCover(it.cp))return;const N=Math.max(1,Math.min(64,parseInt(val(it.cnt))||parseInt(val(it.alt))||1)),b=i=>`s${it.s}_ui${i}_`,R2=[];for(let i=1;i<=N;i++)if(["mod","sn","ind","loc"].some(x=>S[b(i)+x]))R2.push([i].concat(["mod","sn","ind","loc"].map(x=>S[b(i)+x]||"")));if(R2.length){out();pend.push(`<table><tr><th>U.I.</th><th>Modello</th><th>Matricola</th><th>N. indirizzo</th><th>Locale / zona</th></tr>${R2.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`)}return}
      if(it.k==="tri"){const i=it.names.findIndex(n=>S[n]&&S[n]!=="Off");if(i>=0)rows.push([it.l,it.o[i]==="NV"||it.o[i]==="NA"?"N.A.":it.o[i]])}
      if(it.k==="tab"){const R=it.rows.filter(r=>r.f.some(f=>f&&!hid(f)&&fv(f)));if(R.length){out();pend.push(`<table><tr><th></th>${it.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${R.map(r=>`<tr><td>${esc(r.l)}</td>${r.f.map(f=>`<td>${esc(!f||hid(f)?"":fv(f))}</td>`).join("")}</tr>`).join("")}</table>`)}}});
    out()});
  let box=$("#pdfsrc");if(!box){box=document.createElement("div");box.id="pdfsrc";box.style.display="none";document.body.appendChild(box)}box.innerHTML=h;
  const FO=window.FOTO;if(only==="cart")window.FOTO=null;try{PDFK.share(box,{title:only==="cart"?"Cartolina garanzia":SPEC.title,code:only==="cart"&&SPEC.cartCode?SPEC.cartCode:SPEC.code,name:base()+(only==="cart"?"_cartolina":"")})}finally{window.FOTO=FO}}
load();PR.pull(S,KEYP);renderAll();
</script>
